<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>og</title>
<!-- Modelo das imagens de compartilhamento (1200×630). O tools/og.mjs abre esta página no Chrome
     headless com os dados no #hash e tira o print. -->
<link rel="stylesheet" href="../assets/css/tokens.css">
<style>
@font-face{font-family:"Archivo";font-weight:500 700;font-stretch:112%;src:url(../assets/fonts/archivo-500_700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400 600;src:url(../assets/fonts/ibm-plex-sans-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(../assets/fonts/ibm-plex-mono-500.woff2) format("woff2")}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--tinta);color:var(--papel)}
body{position:relative;font-family:"IBM Plex Sans",sans-serif}
.cena{position:absolute;inset:0;perspective:1500px;perspective-origin:20% 30%}
.plano{position:absolute;left:560px;top:-40px;display:grid;grid-template-columns:repeat(3,440px);gap:22px;transform-origin:0 0;transform:translateZ(-520px) rotateX(12deg) rotateY(-28deg) rotateZ(-6deg)}
.tela{border:1px solid var(--cabo-forte);border-radius:12px;overflow:hidden;background:#040608}
.tela .barra{height:28px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--rack);border-bottom:1px solid var(--cabo);font:500 13px/1 "IBM Plex Mono",monospace;color:var(--papel-3)}
.tela .barra i{width:7px;height:7px;border-radius:50%;background:var(--link)}
.tela img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:50% 0}
.mascara{position:absolute;inset:0;background:linear-gradient(90deg,var(--tinta) 0,var(--tinta) 44%,rgba(9,12,16,.7) 52%,transparent 62%),linear-gradient(0deg,var(--tinta) 0,transparent 18%)}
.texto{position:absolute;left:64px;top:56px;bottom:56px;width:560px;display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:12px;font:600 22px/1 "Archivo",sans-serif;font-stretch:112%;letter-spacing:-.01em}
.marca svg{width:32px;height:32px;color:var(--papel)}
.kicker{margin-top:auto;display:flex;align-items:center;gap:10px;font:500 15px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--papel-2)}
.kicker i{width:10px;height:10px;border-radius:50%;background:var(--cor,var(--link));box-shadow:0 0 0 4px color-mix(in srgb,var(--cor,var(--link)) 20%,transparent)}
h1{margin-top:18px;font:650 70px/.98 "Archivo",sans-serif;font-stretch:112%;letter-spacing:-.035em}
h1.longo{font-size:56px}
p{margin-top:20px;max-width:520px;font-size:24px;line-height:1.4;color:var(--papel-2)}
.rodape{margin-top:28px;font:500 16px/1 "IBM Plex Mono",monospace;color:var(--link)}
</style>
</head>
<body>
<div class="cena"><div class="plano" id="plano"></div></div>
<div class="mascara"></div>
<div class="texto">
  <div class="marca"><svg viewBox="0 0 100 100"><path d="M30 22H48A28 28 0 0 1 48 78H30Z" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round"/><circle cx="30" cy="50" r="11" fill="#090C10"/><circle cx="30" cy="50" r="7" fill="#46E08C"/></svg>davi castro</div>
  <div class="kicker" id="kicker"><i></i><span></span></div>
  <h1 id="titulo"></h1>
  <p id="sub"></p>
  <div class="rodape" id="rodape">davicjc.com</div>
</div>
<script>
const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const cores = { no_ar: 'var(--link)', desenvolvimento: 'var(--atividade)', prototipo: 'var(--atividade)', aguardando: 'var(--papel-3)', abandonado: 'var(--desligado)', historico: 'var(--desligado)' };
document.getElementById('kicker').style.setProperty('--cor', cores[d.situacao] || 'var(--link)');
document.querySelector('#kicker span').textContent = d.kicker;
const h1 = document.getElementById('titulo');
h1.textContent = d.titulo;
if (d.titulo.length > 22) h1.classList.add('longo');
document.getElementById('sub').textContent = d.sub;
document.getElementById('rodape').textContent = d.rodape || 'davicjc.com';
document.getElementById('plano').innerHTML = (d.telas || []).map(t => `<div class="tela"><div class="barra"><i></i>${t.nome}</div><img src="../${t.src}"></div>`).join('');
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => document.body.dataset.pronto = '1');
</script>
</body>
</html>
