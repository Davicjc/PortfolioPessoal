<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAVI CASTRO — ENGINEER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<style>
/* RADICAL AESTHETIC - ZERO PREVIOUS INFLUENCE */
:root {
  --bg: #000000;
  --fg: #f5f5f5;
  --accent: #00ff6a; /* Cyber green */
  --muted: #444444;
  --font-display: 'Anton', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-family: var(--font-body); background: var(--bg); color: var(--fg); font-size: 16px; overscroll-behavior: none; }
body { overflow-x: hidden; width: 100vw; background: radial-gradient(circle at 50% 0%, rgba(0,255,106,0.05) 0%, transparent 60%); min-height: 100vh; }

/* Noise Texture Overlay */
body::after {
  content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
  opacity: 0.04; pointer-events: none; z-index: 9999;
}

/* Typography */
.t-disp { font-family: var(--font-display); text-transform: uppercase; line-height: 0.85; margin: 0; }
.t-mono { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: -0.02em; }
.btn { background: transparent; color: var(--fg); border: 1px solid var(--muted); padding: 0.8rem 1.5rem; font-family: var(--font-mono); font-size: 0.85rem; cursor: pointer; border-radius: 4px; transition: all 0.3s; display: inline-block; text-align: center; }
.btn:hover { background: var(--fg); color: var(--bg); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
a { color: var(--accent); text-decoration: none; }

/* Navigation */
nav { position: fixed; top: 0; width: 100%; padding: 1.5rem 5vw; display: flex; justify-content: space-between; align-items: center; z-index: 100; mix-blend-mode: difference; }
.nav-logo { font-size: 1.5rem; letter-spacing: -0.02em; cursor: pointer; }
.nav-logo a { color: var(--fg); }
.nav-center { display: flex; gap: 2rem; }
.nav-center a { font-family: var(--font-mono); color: var(--muted); font-size: 0.9rem; transition: color 0.3s; }
.nav-center a:hover, .nav-center a.active { color: var(--accent); }
.nav-links { display: flex; gap: 1rem; }
.nav-links button { background: none; border: none; color: var(--fg); font-family: var(--font-mono); cursor: pointer; transition: color 0.3s; font-size: 0.9rem; }
.nav-links button:hover, .nav-links button[aria-pressed="true"] { color: var(--accent); }

/* Sections */
.page-container { opacity: 0; transition: opacity 0.5s ease-out; }
.page-container.visible { opacity: 1; }

.section { position: relative; width: 100vw; padding: 10vh 5vw; display: flex; flex-direction: column; justify-content: center; }
.hero { min-height: 100vh; justify-content: center; overflow: hidden; }
.hero-huge-1, .hero-huge-2 { font-size: clamp(3rem, 9vw, 7.5rem); white-space: nowrap; transform-origin: center; }
.hero-huge-1 { color: var(--fg); }
.hero-huge-2 { color: transparent; -webkit-text-stroke: 2px var(--muted); padding-left: 10vw; }
.hero-meta { position: absolute; bottom: 5vh; left: 5vw; max-width: 400px; font-size: 1.1rem; line-height: 1.5; color: var(--dim); }

/* Marquee (Skills) */
.marquee-container { width: 100%; overflow: hidden; padding: 5rem 0; border-top: 1px solid var(--muted); border-bottom: 1px solid var(--muted); }
.marquee-inner { display: flex; width: max-content; }
.marquee-item { font-size: clamp(2rem, 4.5vw, 3.5rem); color: var(--fg); margin-right: 3rem; -webkit-text-stroke: 1px var(--fg); color: transparent; transition: color 0.3s; }
.marquee-item:hover { color: var(--accent); -webkit-text-stroke: 0; }

/* Browser Mockup Frame */
.browser-frame {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  background: #111;
}
.browser-bar {
  height: 30px; background: #050505; border-bottom: 1px solid var(--muted);
  display: flex; align-items: center; padding: 0 1rem; gap: 6px;
}
.browser-bar i {
  width: 10px; height: 10px; border-radius: 50%; background: #444;
}
.browser-bar i:nth-child(1) { background: #ef4444; }
.browser-bar i:nth-child(2) { background: #f59e0b; }
.browser-bar i:nth-child(3) { background: #10b981; }

/* Horizontal Projects Showcase */
.horizontal-scroll-wrapper { height: 72vh; display: flex; align-items: center; overflow: hidden; position: relative; }
.horizontal-container { display: flex; height: 62vh; padding: 0 5vw; gap: 3vw; }
.project-card { flex: 0 0 46vw; height: 100%; position: relative; border-radius: 12px; overflow: hidden; background: #111; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid var(--muted); }
.project-img { width: 100%; height: calc(100% - 30px); object-fit: cover; opacity: 0.6; transition: opacity 0.5s, transform 0.5s; }
.project-card:hover .project-img { opacity: 0.9; transform: scale(1.05); }
.project-info { position: absolute; bottom: 0; left: 0; padding: 3rem; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); pointer-events: none; }
.project-info * { pointer-events: auto; }
.project-cat { font-family: var(--font-mono); color: var(--accent); margin-bottom: 1rem; }
.project-title { font-size: clamp(1.5rem, 3vw, 2.6rem); margin-bottom: 0.5rem; }
.project-desc { font-size: 1.1rem; max-width: 600px; }
.project-links { display: flex; gap: 1rem; margin-top: 1.5rem; }

/* Projects Grid (For /projetos page) */
.page-title { font-size: clamp(4rem, 10vw, 8rem); margin-bottom: 2rem; padding-top: 15vh; }
.projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; margin-top: 4rem; }
.grid-card { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--muted); aspect-ratio: 16/10; display: flex; flex-direction: column; justify-content: flex-end; }
.grid-img { width: 100%; height: calc(100% - 30px); object-fit: cover; opacity: 0.6; transition: all 0.4s; }
.grid-card:hover .grid-img { opacity: 0.9; transform: scale(1.05); }
.grid-info { position: absolute; bottom: 0; left: 0; padding: 1.5rem; width: 100%; background: linear-gradient(to top, rgba(0,0,0,1), transparent); }
.grid-title { font-family: var(--font-display); font-size: 2rem; margin-bottom: 0.5rem; }
.grid-links { display: flex; gap: 0.5rem; margin-top: 1rem; }
.grid-links .btn { padding: 0.5rem 1rem; font-size: 0.75rem; }

/* Experiences Timeline (For /sobre page) */
.exp-list { border-top: 1px solid var(--muted); margin-top: 4rem; }
.exp-item { display: grid; grid-template-columns: 1fr 3fr; padding: 3rem 0; border-bottom: 1px solid var(--muted); transition: background 0.3s; }
.exp-item:hover { background: rgba(255,255,255,0.02); }
.exp-period { font-family: var(--font-mono); color: var(--accent); font-size: 1.2rem; }
.exp-role { font-size: 2.5rem; margin-bottom: 1rem; font-family: var(--font-display); letter-spacing: 0.02em; }
.exp-company { font-size: 1.2rem; color: var(--dim); margin-bottom: 1rem; }
.exp-desc { font-size: 1.1rem; line-height: 1.6; max-width: 800px; }

/* Footer Contact */
.footer { height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-top: 1px solid var(--muted); }
.footer-huge { font-size: clamp(3rem, 10vw, 8rem); margin-bottom: 2rem; transition: color 0.5s; cursor: crosshair; }
.footer-huge:hover { color: var(--accent); }
.footer-links { display: flex; gap: 3rem; font-family: var(--font-mono); font-size: 1.2rem; }
.footer-links a { color: var(--fg); text-transform: uppercase; }
.footer-links a:hover { color: var(--accent); }

@media(max-width: 800px) {
  nav { flex-wrap: wrap; gap: 1rem; }
  .nav-center { width: 100%; justify-content: space-between; order: 3; margin-top: 1rem; }
  .exp-item { grid-template-columns: 1fr; gap: 1rem; padding: 2rem 0; }
  .project-card { flex: 0 0 85vw; padding: 0; }
  .project-info { padding: 2rem; }
}

/* ══════════════════════════════════════════════════════════════════
   REDESIGN 2026 — tokens extra, seções restauradas, camada de FX
   ══════════════════════════════════════════════════════════════════ */
:root{
  --card:#0b0b0b; --border:#1e1e1e; --ring:#00ff6a; --dim:#9a9a9a;
  --font-quote:'Playfair Display', Georgia, serif;
  --sp-1:.5rem; --sp-2:1rem; --sp-3:1.5rem; --sp-4:2.5rem; --sp-5:4rem; --sp-6:6rem;
}

/* Acessibilidade — foco sempre visível */
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:2px; }
a:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

/* Cabeçalho de seção reutilizável */
.section-head{ margin-bottom:var(--sp-5); }
.section-label{ font-family:var(--font-mono); color:var(--accent); font-size:.85rem; letter-spacing:.05em; text-transform:uppercase; display:inline-flex; align-items:center; gap:.6rem; }
.section-label::before{ content:""; width:2rem; height:1px; background:var(--accent); display:inline-block; }
.section-title{ font-family:var(--font-display); text-transform:uppercase; line-height:.92; font-size:clamp(1.9rem,4.2vw,3.4rem); margin-top:.8rem; }
.showcase-head{ padding:11vh 5vw 0; }
.showcase-head .section-head{ margin-bottom:0; }

/* KPIs / números */
.stats-band{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); }
.stat{ background:var(--bg); padding:var(--sp-4) var(--sp-3); display:flex; flex-direction:column; gap:.4rem; }
.stat-num{ font-family:var(--font-display); font-size:clamp(2.6rem,6vw,4.5rem); line-height:1; color:var(--fg); }
.stat-num .u{ color:var(--accent); }
.stat-label{ font-family:var(--font-mono); text-transform:uppercase; font-size:.8rem; color:var(--dim); letter-spacing:.03em; }

/* Capacidades */
.cap-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); }
.cap-card{ background:var(--bg); padding:var(--sp-4); transition:background .3s; }
.cap-card:hover{ background:var(--card); }
.cap-card h3{ font-family:var(--font-display); text-transform:uppercase; font-size:1.6rem; margin-bottom:1rem; letter-spacing:.01em; }
.cap-card p{ color:var(--dim); line-height:1.6; margin-bottom:1.4rem; font-size:1.02rem; }
.chips{ display:flex; flex-wrap:wrap; gap:.4rem; }
.chip{ font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; color:var(--fg); border:1px solid var(--border); padding:.32rem .6rem; border-radius:3px; letter-spacing:.02em; transition:border-color .25s,color .25s; }
.cap-card:hover .chip{ border-color:var(--muted); }

/* Camadas (stack visual) */
.layers{ border:1px solid var(--border); }
.layer{ display:grid; grid-template-columns:minmax(120px,1fr) 4fr; gap:2rem; align-items:center; padding:1.4rem var(--sp-3); border-bottom:1px solid var(--border); transition:background .3s; }
.layer:last-child{ border-bottom:0; }
.layer:hover{ background:var(--card); }
.layer-name{ font-family:var(--font-mono); text-transform:uppercase; color:var(--accent); font-size:1rem; letter-spacing:.03em; }
.layer .chips .chip{ border-color:transparent; background:rgba(255,255,255,.03); }

/* Clientes */
.clients-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); }
.client{ background:var(--bg); padding:1.6rem var(--sp-2); font-family:var(--font-mono); text-transform:uppercase; font-size:.95rem; color:var(--dim); letter-spacing:.02em; transition:color .3s,background .3s; display:flex; align-items:center; min-height:80px; }
.client:hover{ color:var(--accent); background:var(--card); }
a.client{ text-decoration:none; }

/* Depoimentos */
.testi-grid{ column-count:3; column-gap:var(--sp-3); }
@media(max-width:1100px){ .testi-grid{ column-count:2; } }
@media(max-width:640px){ .testi-grid{ column-count:1; } }
.testi{ break-inside:avoid; -webkit-column-break-inside:avoid; margin-bottom:var(--sp-3); border:1px solid var(--border); padding:var(--sp-4); display:flex; flex-direction:column; gap:1.2rem; transition:border-color .3s,transform .3s; background:var(--bg); }
.testi:hover{ border-color:var(--muted); }
.testi-quote{ font-family:var(--font-quote); font-style:italic; font-size:1.2rem; line-height:1.5; color:var(--fg); }
.testi-who{ display:flex; align-items:center; gap:1rem; }
.testi-who img{ width:52px; height:52px; border-radius:50%; object-fit:cover; border:1px solid var(--border); }
.testi-name{ font-weight:600; }
.testi-role{ font-family:var(--font-mono); font-size:.75rem; color:var(--dim); text-transform:uppercase; }
.testi-who a{ margin-left:auto; font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; }

/* Certificados */
.cert-filter{ display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:var(--sp-4); }
.cert-filter button{ background:transparent; border:1px solid var(--border); color:var(--dim); font-family:var(--font-mono); font-size:.78rem; text-transform:uppercase; padding:.5rem .9rem; border-radius:4px; cursor:pointer; transition:all .25s; letter-spacing:.02em; }
.cert-filter button:hover{ color:var(--fg); border-color:var(--muted); }
.cert-filter button[aria-pressed="true"]{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
.cert-filter button .n{ opacity:.6; margin-left:.3rem; }
.cert-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); }
.cert{ background:var(--bg); padding:1.6rem var(--sp-3); display:flex; flex-direction:column; gap:.6rem; transition:background .3s; }
.cert:hover{ background:var(--card); }
.cert-emissor{ font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; color:var(--accent); letter-spacing:.03em; }
.cert-titulo{ font-size:1.05rem; line-height:1.35; }
.cert-links{ display:flex; gap:1rem; margin-top:.4rem; }
.cert-links a{ font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; }
.cert[hidden]{ display:none; }

/* Contato estruturado */
.contact-wrap{ display:grid; grid-template-columns:1.2fr 1fr; gap:var(--sp-5); align-items:end; }
.contact-channels{ display:flex; flex-direction:column; border-top:1px solid var(--border); }
.contact-channels a{ display:flex; justify-content:space-between; align-items:center; padding:1.3rem 0; border-bottom:1px solid var(--border); font-family:var(--font-mono); text-transform:uppercase; font-size:.95rem; color:var(--fg); transition:padding-left .3s,color .3s; }
.contact-channels a:hover{ color:var(--accent); padding-left:1rem; }
.contact-channels a .arrow{ color:var(--accent); }
.manifesto{ font-family:var(--font-quote); font-style:italic; font-size:clamp(1.3rem,2.4vw,1.9rem); line-height:1.5; color:var(--dim); border-left:2px solid var(--accent); padding-left:1.5rem; }
.avail{ display:inline-flex; align-items:center; gap:.6rem; font-family:var(--font-mono); font-size:.82rem; text-transform:uppercase; color:var(--accent); margin-bottom:1.4rem; }
.avail .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 0 rgba(0,255,106,.6); animation:pulse 2.2s infinite; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(0,255,106,.55)} 70%{box-shadow:0 0 0 10px rgba(0,255,106,0)} 100%{box-shadow:0 0 0 0 rgba(0,255,106,0)} }

/* Projetos — filtro + detalhe */
.proj-filter{ display:flex; flex-wrap:wrap; gap:.6rem; margin:0 0 var(--sp-4); }
.proj-filter button{ background:transparent; border:1px solid var(--border); color:var(--dim); font-family:var(--font-mono); font-size:.78rem; text-transform:uppercase; padding:.5rem .9rem; border-radius:4px; cursor:pointer; transition:all .25s; }
.proj-filter button:hover{ color:var(--fg); border-color:var(--muted); }
.proj-filter button[aria-pressed="true"]{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
.grid-card[hidden]{ display:none; }
.grid-meta{ color:var(--dim); font-size:.9rem; line-height:1.45; margin:.6rem 0; }
.grid-meta b{ color:var(--fg); font-weight:500; }
.grid-info .chips{ margin:.6rem 0 .2rem; }
.grid-card .btn.ghost{ border-color:var(--accent); color:var(--accent); }
.grid-card.detailed{ aspect-ratio:auto; background:var(--card); justify-content:flex-start; }
.grid-card.detailed .browser-frame{ position:relative; height:auto; background:#111; }
.grid-card.detailed .grid-img{ position:relative; height:190px; opacity:.75; }
.grid-card.detailed:hover .grid-img{ opacity:.95; transform:none; }
.grid-card.detailed .grid-info{ position:relative; background:transparent; padding:1.5rem; }
.grid-card.detailed .grid-links{ margin-top:1.2rem; }

/* Tilt & magnético (base) */
.tilt{ transform-style:preserve-3d; will-change:transform; }
.magnetic{ will-change:transform; }

/* Cursor custom (só ponteiro fino) */
.cursor-dot,.cursor-ring{ position:fixed; top:0; left:0; border-radius:50%; pointer-events:none; z-index:10000; mix-blend-mode:difference; transform:translate(-50%,-50%); }
.cursor-dot{ width:6px; height:6px; background:#fff; }
.cursor-ring{ width:36px; height:36px; border:1px solid #fff; transition:width .25s,height .25s,background .25s,opacity .25s; }
.cursor-ring.grow{ width:64px; height:64px; background:rgba(255,255,255,.12); }
@media (hover:hover) and (pointer:fine){ body.has-cursor{ cursor:none; } body.has-cursor a, body.has-cursor button{ cursor:none; } }

/* Canvas WebGL de fundo + overlay de transição */
#bg-canvas{ position:fixed; inset:0; width:100vw; height:100vh; z-index:-1; pointer-events:none; opacity:.9; }
.page-wipe{ position:fixed; inset:0; background:var(--accent); z-index:9000; pointer-events:none; transform:scaleY(0); transform-origin:bottom; }

/* Visor modal */
.visor{ border:none; padding:0; width:min(1100px,92vw); max-width:92vw; background:#050505; color:var(--fg); border:1px solid var(--muted); border-radius:12px; overflow:hidden; }
.visor::backdrop{ background:rgba(0,0,0,.85); backdrop-filter:blur(4px); }
.visor-top{ display:flex; align-items:center; gap:1rem; padding:.7rem 1rem; border-bottom:1px solid var(--border); background:#0a0a0a; }
.visor-dots{ display:flex; gap:6px; }
.visor-dots i{ width:11px; height:11px; border-radius:50%; background:#444; }
.visor-dots i:nth-child(1){background:#ef4444}.visor-dots i:nth-child(2){background:#f59e0b}.visor-dots i:nth-child(3){background:#10b981}
.visor-url{ flex:1; font-family:var(--font-mono); font-size:.78rem; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.visor-top .vbtn{ background:transparent; border:1px solid var(--border); color:var(--fg); font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; padding:.35rem .6rem; border-radius:4px; cursor:pointer; transition:all .2s; }
.visor-top .vbtn:hover,.visor-top .vbtn[aria-pressed="true"]{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
.visor-frame{ background:#111; display:flex; justify-content:center; padding:0; }
.visor-frame.mobile{ padding:1.5rem 0; }
.visor iframe{ width:100%; height:70vh; border:0; background:#fff; transition:width .3s; }
.visor-frame.mobile iframe{ width:390px; max-width:92vw; height:70vh; border:1px solid var(--muted); border-radius:24px; }
.card-view{ position:absolute; top:1rem; right:1rem; z-index:5; background:rgba(0,0,0,.6); border:1px solid var(--muted); color:var(--fg); width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; transition:opacity .3s,background .3s; }
.project-card:hover .card-view,.grid-card:hover .card-view{ opacity:1; }
.card-view:hover{ background:var(--accent); color:var(--bg); }

/* Faixa de seção padrão para conteúdo restaurado */
.band{ padding:var(--sp-6) 5vw; }
.band + .band{ border-top:1px solid var(--border); }

/* Reveal (fallback CSS, GSAP assume quando ativo) */
.reveal{ opacity:0; transform:translateY(24px); }
.reveal.in{ opacity:1; transform:none; transition:opacity .7s ease, transform .7s ease; }

@media(max-width:800px){
  .stats-band{ grid-template-columns:repeat(2,1fr); }
  .layer{ grid-template-columns:1fr; gap:.7rem; }
  .contact-wrap{ grid-template-columns:1fr; gap:var(--sp-4); }
  .band{ padding:var(--sp-5) 6vw; }
  .cursor-dot,.cursor-ring{ display:none; }
}

@media (prefers-reduced-motion: reduce){

e decide quem entra — do cadastro do rosto à liberação da porta.","texto_en":"Wiring turnstiles, biometrics and facial recognition into the software that decides who gets in — from enrolling a face to releasing the door.","tecnologias":["Python","C#","OpenCV","face_recognition","MediaPipe","Raspberry Pi"]},{"id":"cap-operacao","ordem":4,"titulo_pt":"Operação e liderança técnica","titulo_en":"Operations & technical leadership","texto_pt":"Supervisão das equipes de NOC, HelpDesk e CGR, organização das demandas técnicas e atendimento em inglês a operadoras internacionais.","texto_en":"Supervising NOC, HelpDesk and network operations teams, organising technical workload and supporting international carriers in English.","tecnologias":["NOC","HelpDesk","CGR","SSO · SAML · OIDC","Trello","Inglês avançado"]}],"experiencias":[{"id":"exp-audicom","ordem":1,"atual":true,"empresa":"Audicom Telecom & Audicom Tecnologia","cargo_pt":"Vice Supervisor · Desenvolvedor Full Stack · Técnico de Redes","cargo_en":"Deputy Supervisor · Full Stack Developer · Network Technician","periodo_pt":"set 2025 — atual","periodo_en":"Sep 2025 — present","descricao_pt":"Desenvolvo os sistemas internos da operação — ordens de serviço de campo, portal de suporte e pedidos de clientes — e integro biometria e reconhecimento facial ao controle de acesso por catracas. Na infraestrutura, administro servidores VMware ESXi, túneis WireGuard e equipamentos MikroTik, Cisco, Ubiquiti e Datacom, com monitoramento em Grafana e Zabbix. Implantei um LMS com login único via SSO (SAML/OIDC) e superviso as equipes de NOC, HelpDesk e CGR.","descricao_en":"I build the operation's internal systems — field service orders, the support portal and customer orders — and integrate biometrics and facial recognition with turnstile access control. On the infrastructure side I run VMware ESXi servers, WireGuard tunnels and MikroTik, Cisco, Ubiquiti and Datacom gear, monitored with Grafana and Zabbix. I rolled out an LMS with single sign-on over SSO (SAML/OIDC) and supervise the NOC, HelpDesk and network operations teams.","progressao_pt":"Atendente de suporte → Programador → Vice Supervisor","progressao_en":"Support agent → Developer → Deputy Supervisor"},{"id":"exp-algar","ordem":2,"atual":false,"empresa":"Algar Telecom","cargo_pt":"Gerente de Relacionamento Empresarial Bilíngue","cargo_en":"Bilingual Enterprise Account Manager","periodo_pt":"dez 2023 — jun 2025","periodo_en":"Dec 2023 — Jun 2025","descricao_pt":"Atendi em inglês o segmento de atacado da operadora, com clientes internacionais como Verizon, BT e China Telecom. Conduzi incidentes críticos de conectividade até a resolução e acompanhei a infraestrutura desses clientes em Grafana e Zabbix.","descricao_en":"I handled the carrier's wholesale segment in English, serving international customers such as Verizon, BT and China Telecom. I drove critical connectivity incidents through to resolution and tracked those customers' infrastructure in Grafana and Zabbix.","progressao_pt":"Atendente → Time Premium → Atacado · Gerência Empresarial","progressao_en":"Agent → Premium team → Wholesale · Enterprise accounts"},{"id":"exp-wpv","ordem":3,"atual":false,"empresa":"Web pra Você · negócio próprio","cargo_pt":"Fundador e desenvolvedor","cargo_en":"Founder and developer","periodo_pt":"2023 — encerrado","periodo_en":"2023 — closed","descricao_pt":"Criação de sites para pequenas e médias empresas, cuidando de proposta, design, desenvolvimento e publicação. O negócio foi encerrado.","descricao_en":"Websites for small and mid-sized businesses, covering proposal, design, development and launch. The business has since closed.","progressao_pt":"","progressao_en":""},{"id":"exp-uniube","ordem":4,"atual":false,"empresa":"Universidade de Uberaba (Uniube)","cargo_pt":"Desenvolvedor Python · Projeto Face Safety","cargo_en":"Python Developer · Face Safety project","periodo_pt":"out — dez 2023","periodo_en":"Oct — Dec 2023","descricao_pt":"Desenvolvi um sistema de controle de acesso por reconhecimento facial em Python e OpenCV, com cadastro pela câmera e liberação de fechadura para usuários autorizados. O projeto ficou em 1º lugar entre 60 trabalhos acadêmicos.","descricao_en":"I built a facial recognition access control system in Python and OpenCV, with camera-based enrolment and lock release for authorised users. The project took 1st place among 60 academic projects.","progressao_pt":"","progressao_en":""},{"id":"exp-callink","ordem":5,"atual":false,"empresa":"Callink · operação Bradesco","cargo_pt":"Agente de atendimento","cargo_en":"Customer service agent","periodo_pt":"out — dez 2023","periodo_en":"Oct — Dec 2023","descricao_pt":"Atendimento a clientes da operação Bradesco, usando técnicas de sondagem para entender e resolver demandas complexas.","descricao_en":"Customer service for the Bradesco operation, using structured questioning to understand and resolve complex requests.","progressao_pt":"","progressao_en":""}],"projetos":[{"id":"audicomhub","ordem":1,"publicado":true,"destaque":true,"vitrine":true,"categoria":"corporativo","titulo_pt":"Audicom Hub","titulo_en":"Audicom Hub","tagline_pt":"Portal interno multiprojeto com controle de acesso por função","tagline_en":"Internal multi-project portal with role-based access control","descricao_pt":"Reúne em um só portal os fluxos internos da operação: chamados, solicitações de manutenção, base de conhecimento de roteadores e registro de rondas técnicas. A autorização em três níveis (user, admin, superadmin) é aplicada nas regras do Firestore, não apenas na interface, e o formulário de ronda salva rascunho automaticamente para o técnico retomar após queda de conexão.","descricao_en":"Brings the operation's internal workflows into a single portal: support tickets, maintenance requests, a router troubleshooting knowledge base and technical patrol logs. Three-level authorization (user, admin, superadmin) is enforced in Firestore security rules rather than only in the UI, and the patrol form autosaves drafts so a technician can resume after losing connection.","papel_pt":"Desenvolvedor full stack, responsável pela arquitetura, modelagem de dados e regras de segurança","papel_en":"Full stack developer, responsible for architecture, data modeling and security rules","impacto_pt":"Registro de rondas em campo sobrevive a queda de conexão, e o acesso por função e por cliente fica delimitado no próprio banco.","impacto_en":"Field patrol logging survives connection drops, and per-role and per-client access is enforced at the database layer.","stack":["JavaScript","Firebase Auth","Firestore","PWA / Service Worker","HTML5","CSS3"],"demo":"https://davicjc.github.io/AudicomHub/","repo":"https://github.com/Davicjc/AudicomHub","imagem":"fotos/projetos/audicomhub.webp","tipo_botao":"demo"},{"id":"telemetry","ordem":2,"publicado":true,"destaque":true,"vitrine":false,"categoria":"open-source","titulo_pt":"Telemetry Portal","titulo_en":"Telemetry Portal","tagline_pt":"Monitoramento de OSPF e BFD em MikroTik, auto-hospedado","tagline_en":"Self-hosted OSPF and BFD monitoring for MikroTik routers","descricao_pt":"No MikroTik, um vizinho OSPF que cai simplesmente some da tabela: não existe estado down para consultar. O portal mantém um registro dos vizinhos já vistos e infere a queda pela ausência, com proteção contra falso-positivo quando o PE inteiro fica inacessível. Detecta sozinho se o RouterOS é v6 ou v7, já que o BFD fica em caminhos diferentes da API.","descricao_en":"On MikroTik, an OSPF neighbor that drops simply disappears from the table: there is no down state to poll for. The portal keeps a registry of every neighbor it has seen and infers the drop from the absence, guarding against the false positive where an entire PE goes unreachable. It also detects whether RouterOS is v6 or v7, since BFD sits at different API paths.","papel_pt":"Autor solo: backend Flask, front-end Jinja/Chart.js, empacotamento systemd e deploy em produção","papel_en":"Sole author: Flask backend, Jinja/Chart.js front end, systemd packaging and production deployment","impacto_pt":"A queda e o retorno de cada vizinho chegam ao Telegram uma única vez por transição, a partir de um coletor em segundo plano, sem depender de alguém olhando o painel.","impacto_en":"Drops and recoveries reach Telegram once per transition, from a background collector, so nobody has to be watching a panel.","stack":["Python","Flask","SQLite","RouterOS API","Grafana","Prometheus"],"demo":"","repo":"https://github.com/Davicjc/telemetry-portal","imagem":"","tipo_botao":"demo"},{"id":"nexusatlas","ordem":3,"publicado":true,"destaque":true,"vitrine":false,"categoria":"corporativo","titulo_pt":"NexusAtlas","titulo_en":"NexusAtlas","tagline_pt":"Gestão de ordens de serviço de campo em tempo real, no navegador","tagline_en":"Field service orders, real time, straight from the browser","descricao_pt":"Centraliza as ordens de serviço de campo da Audicom em um sistema web que roda inteiramente no navegador, sem instalação e sem servidor próprio para manter. O Firebase concentra a camada de dados e propaga cada alteração em tempo real, de modo que escritório e técnico em campo leem e escrevem o mesmo registro de qualquer dispositivo.","descricao_en":"Centralizes Audicom's field service orders in a web system that runs entirely in the browser, with no install and no server of its own to maintain. Firebase holds the data layer and propagates every change in real time, so the office and the technician in the field read and write the same record from any device.","papel_pt":"Desenvolvimento full stack e definição da arquitetura, do modelo de dados ao front-end","papel_en":"Full stack development and architecture, from the data model to the front-end","impacto_pt":"Campo e escritório operam sobre o mesmo registro atualizado, sem cliente instalado e sem infraestrutura de servidor para manter.","impacto_en":"Field and office work from the same up-to-date record, with no client to install and no server infrastructure to maintain.","stack":["JavaScript","Firebase","HTML5","CSS3"],"demo":"","repo":"","imagem":"","tipo_botao":"demo"},{"id":"facesafety","ordem":4,"publicado":true,"destaque":true,"vitrine":true,"categoria":"academico","titulo_pt":"Face Safety","titulo_en":"Face Safety","tagline_pt":"Controle de acesso por reconhecimento facial em Python","tagline_en":"Python-based facial recognition access control","descricao_pt":"Controle de acesso por reconhecimento facial rodando localmente. O operador cadastra a pessoa pela câmera, o sistema guarda o encoding do rosto e o modo scanner compara os quadros ao vivo com a base para identificar quem está na frente do equipamento. Usuários marcados como administradores disparam uma função Key personalizável, usada para acionar fechaduras eletrônicas.","descricao_en":"Facial recognition access control that runs entirely on the local machine. An operator enrolls a person through the camera, the system stores the face encoding, and scanner mode matches live frames against that database to identify who is in front of the device. Users flagged as administrators trigger a customizable Key function that can release an electronic lock.","papel_pt":"Desenvolvedor Python responsável pelo projeto, do pipeline de cadastro e reconhecimento à distribuição das versões para Windows e Linux","papel_en":"Python developer and project owner, from the enrollment and recognition pipeline to the Windows and Linux builds","impacto_pt":"1º lugar entre 60 projetos acadêmicos na Uniube e 16 estrelas no GitHub, com o código aberto e reaproveitável em catracas e fechaduras eletrônicas.","impacto_en":"1st place among 60 academic projects at Uniube and 16 GitHub stars, with the code open and reusable for turnstiles and electronic locks.","stack":["Python","OpenCV","face_recognition","dlib","NumPy","Tkinter"],"demo":"","repo":"https://github.com/Davicjc/FaceSafety","imagem":"fotos/projetos/facesafety.webp","tipo_botao":"demo"},{"id":"roasmonitor","ordem":5,"publicado":true,"destaque":true,"vitrine":false,"categoria":"open-source","titulo_pt":"ROAs Monitor Status","titulo_en":"ROAs Monitor Status","tagline_pt":"Alerta no Telegram quando os ROAs do seu ASN ficam inválidos","tagline_en":"Telegram alerts when your ASN's ROAs go invalid or expire","descricao_pt":"Quando um ROA expira ou o serviço de publicação RPKI (como o Krill) falha, os prefixos do ASN passam a ser vistos como Invalid e operadores que validam RPKI param de aceitar as rotas — sem aviso. O daemon consulta a validade de cada prefixo em intervalo configurável, via RIPEstat ou Routinator local, e alerta no Telegram assim que o status sai de Valid.","descricao_en":"When a ROA expires or the RPKI publication service (Krill, for instance) fails, the ASN's prefixes start being seen as Invalid and operators running RPKI validation silently stop accepting the routes. The daemon polls each prefix at a configurable interval — against public RIPEstat or a local Routinator — and fires a Telegram alert the moment a status leaves Valid.","papel_pt":"Autor e único desenvolvedor, do desenho da lógica de validação ao empacotamento como serviço systemd","papel_en":"Sole author and developer, from the validation logic to packaging it as a systemd service","impacto_pt":"Substitui a descoberta acidental de um ROA inválido, geralmente via reclamação de cliente, por um alerta automático no Telegram no ciclo de verificação seguinte.","impacto_en":"Replaces finding out about an invalid ROA through a customer complaint with an automatic Telegram alert on the next check cycle.","stack":["Bash","RPKI","Telegram Bot API","Routinator","RIPEstat API","systemd"],"demo":"https://davicjc.github.io/ROAs-Monitor-Status/","repo":"https://github.com/Davicjc/ROAs-Monitor-Status","imagem":"fotos/projetos/roasmonitor.webp","tipo_botao":"demo"},{"id":"patricia","ordem":6,"publicado":true,"destaque":false,"vitrine":true,"categoria":"cliente","titulo_pt":"Patricia Moura Lash Design","titulo_en":"Patricia Moura Lash Design","tagline_pt":"Agendamento online em tempo real para um estúdio de cílios","tagline_en":"Real-time online booking for a lash extension studio","descricao_pt":"Permite que a cliente reserve o próprio horário sem troca de mensagens: fluxo de quatro etapas com serviço, calendário, horários livres e formulário que valida CPF e WhatsApp. O Firestore sincroniza a agenda em tempo real, então um horário reservado já aparece indisponível para os demais visitantes. Um painel com Firebase Auth confirma, edita e bloqueia datas.","descricao_en":"Lets clients book their own slot without a back-and-forth chat: a four-step flow covering service, calendar, open times and a form that validates WhatsApp numbers and Brazilian tax-ID check digits. Firestore keeps the calendar in sync in real time, so a taken slot immediately shows as unavailable to everyone else. A Firebase Auth panel confirms, edits and blocks dates.","papel_pt":"Desenvolvedor full stack e único responsável pelo projeto — interface, modelagem no Firestore, autenticação e painel administrativo","papel_en":"Sole full stack developer — interface, Firestore data model, authentication and admin dashboard","impacto_pt":"Agenda autogerenciável com reservas travadas em tempo real e sem servidor próprio: roda inteiramente no plano gratuito do Firebase.","impacto_en":"A self-managed calendar with slots locked in real time and no server of its own: it runs entirely on Firebase's free tier.","stack":["JavaScript","Firebase Firestore","Firebase Auth","HTML5","CSS3","GitHub Pages"],"demo":"https://davicjc.github.io/PatriciaMouraLashDesign/","repo":"https://github.com/Davicjc/PatriciaMouraLashDesign","imagem":"fotos/projetos/patricia.webp","tipo_botao":"pagina"},{"id":"hubcjc","ordem":7,"publicado":true,"destaque":true,"vitrine":false,"categoria":"produto","titulo_pt":"Hub CJC","titulo_en":"Hub CJC","tagline_pt":"Central de projetos, tarefas e contratos com assinatura eletrônica","tagline_en":"Personal hub for projects, tasks and e-signed contracts","descricao_pt":"Painel único para projetos, tarefas, clientes e contratos, substituindo planilhas e anotações dispersas. Contratos são modelados como dados: escopo e pagamento estruturados geram o texto, então cláusula e tabela de parcelas nunca divergem. Cada versão guarda autor, motivo e hash SHA-256, e o cliente assina por link público.","descricao_en":"A single dashboard for projects, tasks, clients and contracts, replacing scattered spreadsheets and notes. Contracts are modeled as data: structured scope and payment generate the text, so the clause and the installment table can never disagree. Every version stores author, reason and a SHA-256 hash, and clients sign via a public link.","papel_pt":"Autor único — arquitetura, modelagem de dados e desenvolvimento full stack","papel_en":"Sole author — architecture, data modeling and full stack development","impacto_pt":"Elimina a divergência entre o texto do contrato e os valores acordados, e permite conferir qualquer via impressa sem acesso ao sistema.","impacto_en":"Removes any gap between contract wording and agreed figures, and lets any printed copy be checked without access to the system.","stack":["TypeScript","React","Firebase","Vite","Tailwind CSS","React Query"],"demo":"","repo":"","imagem":"","tipo_botao":"demo"},{"id":"audicomtelecom","ordem":8,"publicado":true,"destaque":false,"vitrine":false,"categoria":"corporativo","titulo_pt":"Site Audicom Telecom","titulo_en":"Audicom Telecom Website","tagline_pt":"Site institucional em produção da provedora Audicom Telecom","tagline_en":"Production institutional site for telecom provider Audicom","descricao_pt":"Site institucional principal da Audicom Telecom, provedora de telecomunicações. Concentra em um domínio próprio a apresentação dos planos, das soluções corporativas e dos canais de atendimento da operadora. Front-end em HTML, CSS e JavaScript, com layout responsivo e seções dedicadas a soluções e contato.","descricao_en":"Main institutional website for Audicom Telecom, a telecommunications provider. It presents the company's plans, corporate solutions and support channels on its own domain. Built as a responsive front end in HTML, CSS and JavaScript, with dedicated sections for solutions and contact.","papel_pt":"Desenvolvedor responsável pelo front-end e pela estrutura de conteúdo","papel_en":"Developer responsible for the front end and content structure","impacto_pt":"Site no ar em audicomtelecom.com.br, usado como canal oficial de apresentação da operadora a clientes e prospects.","impacto_en":"Live at audicomtelecom.com.br as the operator's official channel for presenting itself to customers and prospects.","stack":["HTML5","CSS3","JavaScript"],"demo":"https://audicomtelecom.com.br/","repo":"","imagem":"fotos/projetos/audicomtelecom.webp","tipo_botao":"pagina"},{"id":"capile","ordem":9,"publicado":true,"destaque":false,"vitrine":false,"categoria":"cliente","titulo_pt":"Capilé Drinks","titulo_en":"Capilé Drinks","tagline_pt":"Cardápio interativo e painel de gestão para bar de drinks autorais","tagline_en":"Interactive menu and management panel for a craft cocktail bar","descricao_pt":"O bar anotava pedidos e controlava o cardápio manualmente, sem registro de vendas. O sistema entrega um cardápio mobile em que o cliente monta o pedido pelo celular, com carrinho e checkout, e um painel administrativo com CRUD do cardápio, aprovação de pedidos e gráficos de faturamento. Persistência em LocalStorage, sem backend para operar.","descricao_en":"The bar took orders and managed its menu by hand, with no record of sales. This delivers a mobile-first menu where the customer builds the order on their phone, with cart and checkout, plus an admin panel for menu CRUD, order approval and revenue charts. State lives in LocalStorage, so there is no backend to run.","papel_pt":"Desenvolvedor único: interface, modelo de dados em LocalStorage e painel administrativo","papel_en":"Sole developer: interface, LocalStorage data model and admin panel","impacto_pt":"Substitui a anotação manual de pedidos por autoatendimento e dá ao dono visibilidade de vendas sem exigir servidor.","impacto_en":"Replaces manual order-taking with self-service and gives the owner sales visibility without running a server.","stack":["HTML5","CSS3","JavaScript","LocalStorage","Chart.js"],"demo":"https://davicjc.github.io/CapileSite/","repo":"https://github.com/Davicjc/CapileSite","imagem":"fotos/projetos/capile.webp","tipo_botao":"demo"},{"id":"speedtest","ordem":10,"publicado":true,"destaque":false,"vitrine":false,"categoria":"corporativo","titulo_pt":"Audicom Speed Test","titulo_en":"Audicom Speed Test","tagline_pt":"Teste de velocidade próprio, medindo na rota real do cliente","tagline_en":"Self-hosted speed test measured on the customer's real route","descricao_pt":"Clientes que relatam lentidão costumam ser medidos por testes públicos, cujo resultado depende do caminho até um servidor de terceiros. O projeto é uma instância própria do LibreSpeed, hospedada em servidores da Audicom e com a identidade visual da empresa, que mede a velocidade dentro da rota real do cliente.","descricao_en":"Customers reporting slow connections are usually measured by public speed tests, whose results depend on the network path to a third-party server. This is a self-hosted LibreSpeed instance running on Audicom's own servers, carrying the company's branding, that measures throughput along the customer's real route.","papel_pt":"Desenvolvedor responsável pela customização, identidade visual e publicação nos servidores da empresa","papel_en":"Developer responsible for customization, branding and deployment on the company's servers","impacto_pt":"Dá ao suporte e ao cliente uma medição de referência feita na infraestrutura da própria Audicom, hoje usada por clientes reais.","impacto_en":"Gives support and customers a reference measurement taken on Audicom's own infrastructure, today used by real customers.","stack":["LibreSpeed","JavaScript","HTML5","CSS3"],"demo":"https://velocidadeteste.audicomtelecom.com.br/","repo":"","imagem":"fotos/projetos/speedtest.webp","tipo_botao":"demo"},{"id":"ddwilber","ordem":11,"publicado":true,"destaque":false,"vitrine":false,"categoria":"cliente","titulo_pt":"Portfólio Dennis Wilber","titulo_en":"Dennis Wilber Portfolio","tagline_pt":"Portfólio one-page para um líder de vendas da Xiaomi Brasil","tagline_en":"One-page career portfolio for a Xiaomi Brazil sales lead","descricao_pt":"Dennis precisava de uma presença própria na web que apresentasse sua trajetória comercial de forma consolidada a quem decide promoções. Construí um site de página única em HTML, CSS e JavaScript puro, com seções de carreira, competências e contato. Sem backend: o formulário serializa os campos em um deep link do WhatsApp, mantendo hospedagem estática e resposta imediata.","descricao_en":"Dennis needed a web presence of his own that presented his sales career in one consolidated place for the people who decide promotions. I built a single-page site in plain HTML, CSS and JavaScript, covering his career path, skills and contact. There is no backend: the form serializes its fields into a WhatsApp deep link, keeping hosting static and replies immediate.","papel_pt":"Desenvolvedor único, do levantamento de conteúdo com o cliente ao deploy","papel_en":"Sole developer, from client content gathering through deployment","impacto_pt":"O próprio cliente declarou publicamente que o site foi decisivo para sua promoção a supervisor de loja na Xiaomi Brasil.","impacto_en":"The client publicly stated that the site was decisive in his promotion to store supervisor at Xiaomi Brazil.","stack":["HTML5","CSS3","JavaScript","GitHub Pages","Google Analytics"],"demo":"https://davicjc.github.io/PortifolioDDWilber/","repo":"https://github.com/Davicjc/PortifolioDDWilber","imagem":"fotos/projetos/ddwilber.webp","tipo_botao":"pagina"},{"id":"acessoaudicom","ordem":12,"publicado":true,"destaque":false,"vitrine":false,"categoria":"corporativo","titulo_pt":"Acesso Audicom (QR Code)","titulo_en":"Audicom Access (QR Code)","tagline_pt":"Liberação de catracas por QR Code gerado no cadastro do visitante","tagline_en":"Turnstile release via QR code generated at visitor sign-in","descricao_pt":"Controle de acesso de visitantes em catracas sem crachá físico nem registro em papel na portaria. O cadastro web valida o CPF por cálculo de dígito, bloqueia duplicidade e gera o QR Code de liberação; um receptor em Java lê o código pela porta serial e aciona o programa de desbloqueio da catraca.","descricao_en":"Visitor access control at turnstiles without physical badges or a paper logbook at the front desk. The web form validates CPF check digits, blocks duplicate entries and generates the release QR code; a Java receiver reads it over the serial port and triggers the turnstile unlock program.","papel_pt":"Desenvolvedor único, responsável pelo front-end de cadastro, pela geração dos QR Codes e pela integração serial com o hardware da catraca","papel_en":"Sole developer, responsible for the sign-in front end, QR code generation and the serial integration with the turnstile hardware","impacto_pt":"Digitaliza o registro de visitantes na portaria e mantém o histórico exportável em CSV, rodando inteiramente no navegador, sem servidor. Descontinuado, mas funcional como demonstração.","impacto_en":"Digitizes front-desk visitor records and keeps an exportable CSV history, running entirely in the browser with no server. Discontinued, but still functional as a demo.","stack":["HTML5","CSS3","JavaScript ES6+","Java","Raspberry Pi Pico"],"demo":"https://davicjc.github.io/AcessoAudicom/","repo":"https://github.com/Davicjc/AcessoAudicom","imagem":"fotos/projetos/acessoaudicom.webp","tipo_botao":"demo"},{"id":"fitia","ordem":13,"publicado":true,"destaque":false,"vitrine":false,"categoria":"open-source","titulo_pt":"FitIA","titulo_en":"FitIA","tagline_pt":"Contagem de repetições e análise de forma por webcam, no navegador","tagline_en":"Rep counting and form analysis from a webcam, fully in the browser","descricao_pt":"Quem treina sozinho conta repetição na mão e não recebe retorno sobre a execução. O FitIA lê 33 pontos corporais por quadro com MediaPipe no próprio navegador, calcula ângulos articulares e conta repetições com uma máquina de estados protegida por buffer de estabilidade, pontuando a qualidade de cada movimento.","descricao_en":"Training alone means counting reps by hand with no feedback on execution. FitIA reads 33 body landmarks per frame using MediaPipe in the browser, derives joint angles, and counts reps through a state machine guarded by a stability buffer, scoring the quality of each movement.","papel_pt":"Desenvolvedor solo, responsável pela visão computacional, pelos algoritmos de contagem e pelo front-end","papel_en":"Solo developer, responsible for the computer vision, the rep-counting algorithms and the front end","impacto_pt":"Todo o processamento roda no cliente: o vídeo não sai do dispositivo e o uso dispensa instalação, servidor de inferência ou hardware dedicado.","impacto_en":"All processing runs client-side: video never leaves the device, and using it requires no install, no inference server and no dedicated hardware.","stack":["JavaScript","MediaPipe","Canvas API","Three.js","Firebase Firestore","HTML5"],"demo":"https://davicjc.github.io/FitIA/","repo":"https://github.com/Davicjc/FitIA","imagem":"fotos/projetos/fitia.webp","tipo_botao":"demo"},{"id":"pedidosaudicom","ordem":14,"publicado":true,"destaque":false,"vitrine":false,"categoria":"corporativo","titulo_pt":"Pedidos Audicom","titulo_en":"Audicom Orders","tagline_pt":"Solicitação de internet pelo cliente e gestão em painel interno","tagline_en":"Customer internet orders, tracked through an internal admin panel","descricao_pt":"Sistema web que centraliza a solicitação e o acompanhamento de pedidos de internet da Audicom Telecom. O cliente abre e consulta o pedido pelo celular ou pelo computador, em interface responsiva, enquanto a equipe interna trata e atualiza cada solicitação por um painel administrativo, com o mesmo status visível para os dois lados.","descricao_en":"A web system that centralizes how Audicom Telecom receives and tracks internet service orders. Customers submit and follow their requests from a phone or a desktop through a responsive interface, while the internal team handles and updates each one in an admin panel, with the same status visible on both sides.","papel_pt":"Desenvolvedor full stack, responsável pelo sistema de ponta a ponta, da interface do cliente ao painel administrativo interno","papel_en":"Full stack developer, responsible for the system end to end, from the customer interface to the internal admin panel","impacto_pt":"Concentra os pedidos de internet em um fluxo único, com o mesmo status acompanhado pelo cliente e pela equipe interna.","impacto_en":"Consolidates internet orders into a single flow, with one status followed by both the customer and the internal team.","stack":["HTML5","CSS3","JavaScript"],"demo":"","repo":"","imagem":"","tipo_botao":"demo"},{"id":"popmanager","ordem":15,"publicado":true,"destaque":false,"vitrine":false,"categoria":"corporativo","titulo_pt":"PopManager","titulo_en":"PopManager","tagline_pt":"Gestão centralizada de POPs de rede para provedor de internet","tagline_en":"Centralized management of network POPs for an ISP","descricao_pt":"Um provedor de internet mantém vários POPs distribuídos, cada um com seus próprios equipamentos, enlaces e configurações. O PopManager reúne esse controle em um sistema server/web escrito em Python: cada ponto de presença fica cadastrado em um só lugar, e a equipe técnica consulta e atualiza os dados pelo navegador.","descricao_en":"An ISP runs several distributed POPs, each with its own equipment, links and configuration. PopManager consolidates that into a single server/web application written in Python: every point of presence is recorded in one place, and the technical team reviews and updates site data straight from the browser.","papel_pt":"Desenvolvedor full stack e responsável pela arquitetura do sistema","papel_en":"Full stack developer, responsible for the system architecture","impacto_pt":"Dá à equipe técnica um registro único e consultável dos POPs, sem depender de acesso local a cada site.","impacto_en":"Gives the technical team a single, queryable record of every POP, without needing local access to each site.","stack":["Python","JavaScript","HTML5","CSS3","Linux Server"],"demo":"","repo":"","imagem":"","tipo_botao":"demo"},{"id":"alpa","ordem":16,"publicado":true,"destaque":false,"vitrine":false,"categoria":"cliente","titulo_pt":"CRM Alpa Solutions","titulo_en":"Alpa Solutions CRM","tagline_pt":"Base única de clientes e histórico comercial para a Valoria","tagline_en":"One system for Valoria's client records and relationship history","descricao_pt":"CRM sob medida para a Alpa Solutions, que atua sob a marca Valoria. O sistema centraliza o cadastro de clientes e o histórico de relacionamento comercial em uma única interface web, acessível pela equipe sem instalação local. Foi desenvolvido em JavaScript e modelado sobre o processo comercial do cliente, em vez de adaptar um CRM genérico de mercado.","descricao_en":"A custom CRM built for Alpa Solutions, which operates under the Valoria brand. It brings client records and the history of each commercial relationship into a single web interface the team can reach from any browser, with no local install. Written in JavaScript and shaped around the client's own sales process instead of bending a generic off-the-shelf CRM to fit.","papel_pt":"Desenvolvedor único do projeto, responsável pela interface, pela lógica da aplicação e pela entrega ao cliente","papel_en":"Sole developer, responsible for the interface, the application logic and delivery to the client","impacto_pt":"Centralizou a base de clientes da Valoria em um sistema próprio, com histórico consultável por toda a equipe.","impacto_en":"Gave Valoria a single owned system for its client base, with history any team member can look up.","stack":["JavaScript","HTML5","CSS3","Git"],"demo":"","repo":"","imagem":"","tipo_botao":"demo"},{"id":"elora","ordem":17,"publicado":true,"destaque":false,"vitrine":false,"categoria":"cliente","titulo_pt":"Instituto Elora","titulo_en":"Instituto Elora","tagline_pt":"Site institucional para clínica de estética e saúde integrativa","tagline_en":"Institutional site for an aesthetics and integrative health clinic","descricao_pt":"Site institucional do Instituto Elora, clínica de estética avançada e saúde integrativa. Desenvolvi a página em HTML, CSS e JavaScript, com layout responsivo para celular e desktop, marcação semântica e carregamento leve, apresentando os serviços da clínica de forma clara para quem pesquisa antes de escolher onde se tratar.","descricao_en":"Institutional website for Instituto Elora, a clinic working with advanced aesthetics and integrative health. I built the page in HTML, CSS and JavaScript, with a responsive layout for phone and desktop, semantic markup and a light payload, presenting the clinic's services clearly to people researching before choosing where to go.","papel_pt":"Desenvolvedor responsável pelo projeto, do layout à publicação","papel_en":"Sole developer, from layout to publishing","impacto_pt":"Deu ao instituto um canal próprio na web para apresentar seus serviços a novos pacientes.","impacto_en":"Gave the clinic a web presence of its own to present its services to new patients.","stack":["JavaScript","HTML5","CSS3","Git"],"demo":"","repo":"","imagem":"","tipo_botao":"demo"},{"id":"gestorapi","ordem":18,"publicado":true,"destaque":false,"vitrine":false,"categoria":"produto","titulo_pt":"Gestor de API","titulo_en":"API Manager","tagline_pt":"Painel Master para credenciais Firebase de múltiplos clientes","tagline_en":"Master panel for multi-client Firebase credentials","descricao_pt":"Cada cliente atendido roda sobre um projeto Firebase próprio, e manter essas credenciais espalhadas por arquivos e repositórios torna qualquer troca ou revogação lenta e arriscada. O painel concentra o cadastro e a consulta dessas chaves em uma única interface Master, escrita em HTML, CSS e JavaScript puro, sem framework nem etapa de build.","descricao_en":"Each client runs on its own Firebase project, so credentials end up scattered across files and repositories, which makes any key swap or revocation slow and risky. The panel concentrates registering and looking up those keys in a single Master interface, written in plain HTML, CSS and JavaScript, with no framework and no build step.","papel_pt":"Desenvolvedor único: arquitetura, interface e integração com o Firebase","papel_en":"Sole developer: architecture, interface and Firebase integration","impacto_pt":"As credenciais de todos os clientes passaram a ser consultadas e atualizadas em um só lugar, sem depender de arquivos espalhados por repositórios.","impacto_en":"Credentials for every client are now looked up and updated in one place, instead of living in files spread across repositories.","stack":["JavaScript","HTML5","CSS3","Firebase"],"demo":"","repo":"","imagem":"","tipo_botao":"demo"},{"id":"desenhobase64","ordem":19,"publicado":true,"destaque":false,"vitrine":false,"categoria":"open-source","titulo_pt":"DesenhoBase64","titulo_en":"DesenhoBase64","tagline_pt":"Canvas HTML5 vira quadro de desenho e assinatura, sem dependências","tagline_en":"HTML5 canvas as a drawing board and signature pad, zero dependencies","descricao_pt":"Formulários que capturam assinatura ou desenho à mão costumam salvar um PNG pesado e não editável. Esta biblioteca JavaScript sem dependências transforma uma tag canvas do HTML5 em quadro de desenho ou painel de assinatura e serializa os traços — coordenadas, espessura e cor — em uma string Base64 curta, recarregável no canvas para edição.","descricao_en":"Web forms that capture a handwritten signature or sketch usually save a heavy PNG that cannot be edited afterwards. This dependency-free JavaScript library turns an HTML5 canvas into a drawing board or signature pad and serializes the strokes — coordinates, thickness and color — into a short Base64 string that can be loaded back into the canvas for editing.","papel_pt":"Autor e mantenedor da biblioteca — desenho da API, motor de captura de traços e página de demonstração","papel_en":"Library author and maintainer — API design, stroke capture engine and demo page","impacto_pt":"Assinaturas e desenhos trafegam como texto leve em vez de imagem, e o traço original volta ao canvas para edição.","impacto_en":"Signatures and drawings travel as lightweight text instead of images, and the original strokes can be reloaded into the canvas for editing.","stack":["JavaScript","HTML5 Canvas","HTML5","CSS3"],"demo":"https://davicjc.github.io/DesenhoBase64/","repo":"https://github.com/Davicjc/DesenhoBase64","imagem":"fotos/projetos/desenhobase64.webp","tipo_botao":"demo"},{"id":"barbearia","ordem":20,"publicado":true,"destaque":false,"vitrine":false,"categoria":"cliente","titulo_pt":"Barbearia Soares","titulo_en":"Barbearia Soares","tagline_pt":"Site de vitrine para barbearia local, em HTML e CSS puros","tagline_en":"Storefront site for a local barbershop, in plain HTML and CSS","descricao_pt":"Site de apresentação para uma barbearia local, entregue como demo para um cliente real. A página é escrita apenas em HTML e CSS, sem framework nem etapa de build: carrega rápido no celular, roda em qualquer hospedagem estática e cada ajuste de conteúdo é uma edição direta na marcação.","descricao_en":"Presentation site for a local barbershop, delivered as a demo for a real client. The page is written in plain HTML and CSS, with no framework and no build step: it loads fast on mobile, runs on any static hosting, and every content change is a direct edit to the markup.","papel_pt":"Desenvolvedor front-end responsável por layout, marcação e entrega ao cliente","papel_en":"Front-end developer responsible for layout, markup and client delivery","impacto_pt":"Dá ao negócio uma vitrine própria na web, com custo de hospedagem e manutenção próximo de zero.","impacto_en":"Gives the business its own storefront on the web, with hosting and maintenance cost close to zero.","stack":["HTML5","CSS3","Git","GitHub"],"demo":"https://davicjc.github.io/BarbeariaSoares/","repo":"https://github.com/Davicjc/BarbeariaSoares","imagem":"fotos/projetos/barbearia.webp","tipo_botao":"pagina"},{"id":"audicomreuniao","ordem":21,"publicado":true,"destaque":false,"vitrine":false,"categoria":"corporativo","titulo_pt":"Painel da Sala de Reunião","titulo_en":"Meeting Room Display","tagline_pt":"Tela de recepção da sala de reunião da Audicom Telecom","tagline_en":"Welcome screen for Audicom Telecom's meeting room","descricao_pt":"Página que fica aberta na tela da sala de reunião da Audicom Telecom. Mostra se a sala está disponível, data, hora e temperatura, oferece o QR Code do Wi-Fi de visitantes e passa em carrossel as marcas de clientes da empresa.","descricao_en":"A page that stays open on the screen in Audicom Telecom's meeting room. It shows whether the room is available, the date, time and temperature, offers a QR code for the guest Wi-Fi and cycles through the company's client logos.","papel_pt":"Design e desenvolvimento front-end","papel_en":"Design and front-end development","impacto_pt":"Visitantes chegam à sala com o Wi-Fi e as informações do dia já na tela, sem precisar pedir.","impacto_en":"Visitors walk into the room with the Wi-Fi details and the day's information already on screen.","stack":["HTML5","CSS3","JavaScript"],"demo":"https://davicjc.github.io/AudicomSiteReuniao/","repo":"https://github.com/Davicjc/AudicomSiteReuniao","imagem":"fotos/projetos/audicomreuniao.webp","tipo_botao":"pagina"},{"id":"qrcodeaudicom","ordem":22,"publicad <script>
var COLECOES = ["capacidades","experiencias","projetos","depoimentos","certificados","clientes","contatos"];
var CHAVE_CACHE = "davicjc.portfolio.v2";
var idioma = "pt";

function c(obj, campo){
  if (!obj) return '';
  var v = obj[campo + '_' + idioma];
  if (v === undefined || v === null || v === '') v = obj[campo + '_pt'];
  if (v === undefined || v === null) v = obj[campo] || '';
  return v;
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function ordenar(lista){
  return (lista||[]).slice().sort(function(a,b){ return (a.ordem||0) - (b.ordem||0); });
}

function urlSegura(u, soWeb){
  u = String(u == null ? '' : u).trim();
  if (!u) return '';
  if (/^https?:\/\//i.test(u)) return u;
  if (soWeb) return '';
  if (/^(mailto:|tel:)/i.test(u)) return u;
  if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';   /* qualquer outro esquema */
  if (/^\/\//.test(u)) return '';                  /* protocolo implícito */
  return u;                                         /* relativo */
}

function urlImagem(u){
  u = String(u == null ? '' : u).trim();
  if (/^data:image\/(png|jpe?g|webp|gif|avif);base64,[a-z0-9+\/=\s]+$/i.test(u)) return u;
  return urlSegura(u);
}

function publicados(lista){ return ordenar(lista).filter(function(x){ return x.publicado !== false; }); }

var CATEGORIAS = {
  corporativo:{pt:'corporativo', en:'corporate'},
  cliente:{pt:'clientes', en:'clients'},
  'open-source':{pt:'open source', en:'open source'},
  produto:{pt:'produto', en:'product'},
  academico:{pt:'acadêmico', en:'academic'},
  pessoal:{pt:'pessoal', en:'personal'}
}

function nomeCategoria(k){ return (CATEGORIAS[k] && CATEGORIAS[k][idioma]) || k; }

/* ── tema ─────────────────────────────────────────────────────── */
var raiz = document.documentElement;
function aplicarTema(tema){
  raiz.setAttribute('data-tema', tema);
  localStorage.setItem('davicjc.tema', tema);
}

function normalizar(d){
  var n = JSON.parse(JSON.stringify(d || {}));
  COLECOES.forEach(function(k){
    if (Array.isArray(n[k])) n[k].sort(function(a, b){
      return ((a.ordem || 0) - (b.ordem || 0)) || String(a.id).localeCompare(String(b.id));
    });
  });
  return n;
}

function canonico(v){
  if (Array.isArray(v)) return '[' + v.map(canonico).join(',') + ']';
  if (v && typeof v === 'object'){
    return '{' + Object.keys(v).sort().map(function(k){ return JSON.stringify(k) + ':' + canonico(v[k]); }).join(',') + '}';
  }
  return JSON.stringify(v);
}

window.__hidratar = function(remoto){
  if (!remoto) return;
  var novo = JSON.parse(JSON.stringify(DADOS));
  var semeado = !!remoto.site;
  ['site'].concat(COLECOES).forEach(function(k){
    if (!remoto[k]) return;
    if (Array.isArray(remoto[k]) && !remoto[k].length && !semeado) return;   /* banco sem carga: mantém a semente */
    novo[k] = remoto[k];
  });
  novo = normalizar(novo);
  try { localStorage.setItem(CHAVE_CACHE, JSON.stringify(novo)); } catch (e) {}
  if (canonico(novo) === canonico(DADOS)) return;   /* nada mudou: não redesenha */
  DADOS = novo;
  if (visor.classList.contains('aberto')) return;    /* não mexe na tela com o visor aberto */
  rotear({ manterRolagem: true, semAnimacao: true });
};



var DADOS = (function(){
  try {
    var salvo = JSON.parse(localStorage.getItem(CHAVE_CACHE) || 'null');
    if (salvo && salvo.projetos && salvo.site) return normalizar(salvo);
  } catch (e) {}
  return normalizar(window.SEMENTE);
})();

var app = document.getElementById('app');

function urlDemo(p){
  if (p.demo) return p.demo;
  var arr = (p.links||[]).filter(function(x){ return x && !x.repo && x.url; });
  return arr.length ? arr[0].url : '';
}
function urlRepo(p){
  if (p.repo) return p.repo;
  var arr = (p.links||[]).filter(function(x){ return x && x.repo && x.url; });
  return arr.length ? arr[0].url : '';
}

/* ── seções restauradas (redesign 2026) ─────────────────────────── */
function secHead(labelPt, labelEn, titulo){
  var lab = idioma==='en' ? labelEn : labelPt;
  return '<div class="section-head reveal"><span class="section-label">'+esc(lab)+'</span>'+
         (titulo ? '<h2 class="section-title">'+esc(titulo)+'</h2>' : '')+'</div>';
}
function chipsHTML(arr){
  if(!arr || !arr.length) return '';

var lenis;
function initGSAP(hash) {
  if (!window.gsap || !window.ScrollTrigger) return;
  
  if (!lenis) {
    lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);
  }

  ScrollTrigger.getAll().forEach(t => t.kill());
  window.scrollTo(0, 0);

  if (hash === '#/' || hash === '') {
    gsap.to("#h-text-1", { xPercent: -20, ease: "none", scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: 1 } });
    gsap.to("#h-text-2", { xPercent: 20, ease: "none", scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: 1 } });

    let marquee = document.getElementById('marquee');
    if (marquee) {
      let tween = gsap.to(marquee, { xPercent: -50, repeat: -1, duration: 20, ease: "linear" });
      ScrollTrigger.create({
        trigger: ".marquee-container",
        start: "top bottom",
        end: "bottom top",
        onUpdate: (self) => { gsap.to(tween, { timeScale: self.direction === 1 ? 1 : -1, overwrite: true }); }
      });
    }

    var hContainer = document.getElementById('h-container');
    if (hContainer) {
      var amountToScroll = hContainer.scrollWidth - window.innerWidth;
      if (amountToScroll > 0) {
        gsap.to(hContainer, {
          x: -amountToScroll,
          ease: "none",
          scrollTrigger: {
            trigger: "#projects-pin",
            start: "top top",
            end: "+=" + amountToScroll,
            pin: true,
            animation: gsap.to(hContainer, { x: -amountToScroll, ease: "none" }),
            scrub: 1
          }
        });
      }
    }
  }

  var fades = document.querySelectorAll('.GSAP-fade');
  fades.forEach(f => {
    gsap.fromTo(f, { opacity: 0, y: 30 }, {
      opacity: 1, y: 0, duration: 1, ease: "power3.out",
      scrollTrigger: { trigger: f, start: "top 90%" }
    });
  });
}

function updateNav(hash) {
  var links = document.querySelectorAll('#nav-menu a');
  var match = hash === '' ? '#/' : hash;
  links.forEach(l => {
    if(l.getAttribute('href') === match) l.classList.add('active');
    else l.classList.remove('active');
  });
  
  var l_home = document.querySelector('[data-route="/"]');
  var l_proj = document.querySelector('[data-route="/projetos"]');
  var l_sobre = document.querySelector('[data-route="/sobre"]');
  if (l_home) l_home.innerText = idioma === 'en' ? 'HOME' : 'INÍCIO';
  if (l_proj) l_proj.innerText = idioma === 'en' ? 'PROJECTS' : 'PROJETOS';
  if (l_sobre) l_sobre.innerText = idioma === 'en' ? 'ABOUT' : 'SOBRE';
}

function rotear() {
  app.classList.remove('visible');
  
  setTimeout(() => {
    var hash = location.hash || '#/';
    if (hash === '#/') renderHome();
    else if (hash === '#/projetos') renderProjects();
    else if (hash === '#/sobre') renderAbout();
    else renderHome();
    
    buildFooter();
    initGSAP(hash);
    updateNav(hash);

    app.classList.add('visible');
    document.dispatchEvent(new CustomEvent('davicjc:render', { detail: { hash: hash } }));
  }, 50);
}

<script>
/* ══════════════════════════════════════════════════════════════════

   no evento 'davicjc:render' e respeita prefers-reduced-motion.
   ══════════════════════════════════════════════════════════════════ */
(function(){
  var RM = function(){ return matchMedia('(prefers-reduced-motion: reduce)').matches; };
  var FINE = matchMedia('(hover:hover) and (pointer:fine)').matches;
  var lerp = function(a,b,n){ return (1-n)*a + n*b; };

  /* ── Cursor custom (monta 1x) ─────────────────────────────────── */
  var dot = document.querySelector('.cursor-dot'),
      ring = document.querySelector('.cursor-ring');
  if(FINE && !RM() && dot && ring){
    document.body.classList.add('has-cursor');
    var mx=innerWidth/2, my=innerHeight/2, rx=mx, ry=my;
    addEventListener('mousemove', function(e){ mx=e.clientX; my=e.clientY; dot.style.transform='translate('+mx+'px,'+my+'px) translate(-50%,-50%)'; });
    (function loop(){ rx=lerp(rx,mx,.18); ry=lerp(ry,my,.18); ring.style.transform='translate('+rx+'px,'+ry+'px) translate(-50%,-50%)'; requestAnimationFrame(loop); })();
    addEventListener('mouseover', function(e){ if(e.target.closest('a,button,.tilt,.card-view,.marquee-item')) ring.classList.add('grow'); });
    addEventListener('mouseout',  function(e){ if(e.target.closest('a,button,.tilt,.card-view,.marquee-item')) ring.classList.remove('grow'); });
  }

  /* ── Hero WebGL de fundo (monta 1x, no load) ──────────────────── */
  addEventListener('load', function(){
    var cv = document.getElementById('bg-canvas');
    if(!cv || !window.THREE || RM() || innerWidth < 800) return;
    try{
      var renderer = new THREE.WebGLRenderer({ canvas:cv, alpha:true, antialias:true });
      renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth, innerHeight);
      var scene = new THREE.Scene();
      var cam = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, .1, 1000); cam.position.z = 60;
      var N = 900, geo = new THREE.BufferGeometry(), pos = new Float32Array(N*3);
      for(var i=0;i<N*3;i++) pos[i] = (Math.random()-.5) * 180;
      geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
      var mat = new THREE.PointsMaterial({ color:0x00ff6a, size:.6, transparent:true, opacity:.7 });
      var pts = new THREE.Points(geo, mat); scene.add(pts);
      var tmx=0, tmy=0;
      addEventListener('mousemove', function(e){ tmx=(e.clientX/innerWidth-.5); tmy=(e.clientY/innerHeight-.5); });
      addEventListener('resize', function(){ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
      (function anim(){ requestAnimationFrame(anim);
        pts.rotation.y += .0006; pts.rotation.x += .0002;
        cam.position.x = lerp(cam.position.x, tmx*22, .04);
        cam.position.y = lerp(cam.position.y, -tmy*22, .04);
