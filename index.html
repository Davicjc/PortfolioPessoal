      })();
    }catch(e){ /* sem WebGL: fundo permanece o gradiente CSS */ }
  });

  /* ── Transição de página (wipe) no hashchange ─────────────────── */
  var wipe = document.querySelector('.page-wipe');
  addEventListener('hashchange', function(){
    if(!wipe || RM() || !window.gsap) return;
    gsap.fromTo(wipe, { scaleY:0, transformOrigin:'bottom' }, { scaleY:1, duration:.35, ease:'power3.in', onComplete:function(){
      gsap.to(wipe, { scaleY:0, transformOrigin:'top', duration:.45, ease:'power3.out', delay:.05 });
    }});
  });

  /* ── Scramble de texto ────────────────────────────────────────── */
  var GLYPHS = '█▓▒░<>/\\{}[]#$%&@ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  function scramble(el, dur){
    var final = el.getAttribute('data-final') || el.textContent; el.setAttribute('data-final', final);
    var start = performance.now();
    (function step(now){
      var p = Math.min(1, (now-start)/dur), reveal = Math.floor(p*final.length), out='';
      for(var i=0;i<final.length;i++){
        if(final[i]===' '){ out+=' '; continue; }
        out += i < reveal ? final[i] : GLYPHS[(Math.random()*GLYPHS.length)|0];
      }
      el.textContent = out;
      if(p<1) requestAnimationFrame(step); else el.textContent = final;
    })(start);
  }

  /* ── Bind por render ──────────────────────────────────────────── */
  var io;
  function bind(){
    var reduced = RM();

    /* reveal + count-up */
    if(io) io.disconnect();
    var reveals = document.querySelectorAll('.reveal');
    if(reduced || !('IntersectionObserver' in window)){
      reveals.forEach(function(el){ el.classList.add('in'); doCount(el); });
    } else {
      io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); doCount(en.target); io.unobserve(en.target); } });
      }, { threshold:.15, rootMargin:'0px 0px -8% 0px' });
      reveals.forEach(function(el){ io.observe(el); });
    }

    if(reduced) return; /* sem interação de movimento */

    /* scramble nos títulos-display do hero */
    if((location.hash==='#/'||location.hash==='')){
      ['h-text-1','h-text-2'].forEach(function(id){ var el=document.getElementById(id); if(el) scramble(el, 900); });
    }

    if(!FINE) return; /* magnético/tilt só em ponteiro fino */

    /* magnético */
    document.querySelectorAll('.btn, .nav-center a, .card-view, .cert-filter button, .proj-filter button').forEach(function(el){
      el.addEventListener('mousemove', function(e){ var r=el.getBoundingClientRect(); el.style.transform='translate('+((e.clientX-r.left-r.width/2)*.3)+'px,'+((e.clientY-r.top-r.height/2)*.4)+'px)'; });
      el.addEventListener('mouseleave', function(){ el.style.transform=''; });
    });

    /* tilt 3D */
    document.querySelectorAll('.tilt').forEach(function(el){
      var raf=null;
      el.addEventListener('mousemove', function(e){ if(raf) return; raf=requestAnimationFrame(function(){ raf=null;
        var r=el.getBoundingClientRect(), px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
        el.style.transform='perspective(900px) rotateY('+(px*6)+'deg) rotateX('+(-py*6)+'deg)';
      }); });
      el.addEventListener('mouseleave', function(){ el.style.transform=''; });
    });
  }
  function doCount(scope){
    var el = scope.matches && scope.matches('.stat') ? scope.querySelector('[data-count]') : (scope.querySelector && scope.querySelector('.stat [data-count]'));
    if(scope.querySelectorAll) scope.querySelectorAll('[data-count]').forEach(runCount);
  }
  function runCount(node){
    if(node.__done) return; node.__done=true;
    var target=parseInt(node.getAttribute('data-count'),10)||0, unit=node.querySelector('.u'), u=unit?unit.outerHTML:'';
    if(RM()){ node.innerHTML=target+u; return; }
    var start=performance.now(), dur=1100;
    (function s(now){ var p=Math.min(1,(now-start)/dur), v=Math.round(target*(1-Math.pow(1-p,3)));
      node.innerHTML=v+u; if(p<1) requestAnimationFrame(s); })(start);
  }

  document.addEventListener('davicjc:render', bind);
  if(document.querySelector('.reveal')) bind(); /* caso o 1º render já tenha ocorrido */

  /* ── Filtros (delegação, sobrevive a re-render) ───────────────── */
  document.addEventListener('click', function(e){
    var cb = e.target.closest('.cert-filter button[data-cert]');
    if(cb){
      var val=cb.getAttribute('data-cert');
      cb.parentNode.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b===cb?'true':'false'); });
      document.querySelectorAll('#cert-grid .cert').forEach(function(card){
        card.hidden = !(val==='*' || card.getAttribute('data-emissor')===val);
      });
      return;
    }
    var pb = e.target.closest('.proj-filter button[data-cat]');
    if(pb){
      var cat=pb.getAttribute('data-cat');
      pb.parentNode.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b===pb?'true':'false'); });
      document.querySelectorAll('.projects-grid .grid-card').forEach(function(card){
        card.hidden = !(cat==='*' || card.getAttribute('data-cat')===cat);
      });
      return;
    }
  });

  /* ── Visor modal ──────────────────────────────────────────────── */
  var vis=document.getElementById('visor'), vif=document.getElementById('visor-iframe'),
      vurl=document.getElementById('visor-url'), vframe=document.getElementById('visor-frame'),
      vopen=document.getElementById('visor-open'), vhint=null, vtimer=null;
  function setModo(m){
    document.getElementById('visor-desktop').setAttribute('aria-pressed', m==='desktop'?'true':'false');
    document.getElementById('visor-mobile').setAttribute('aria-pressed', m==='mobile'?'true':'false');
    vframe.classList.toggle('mobile', m==='mobile');
  }
  function abrirVisor(url){
    if(!vis || !url) return;
    vurl.textContent=url; vopen.href=url; setModo('desktop');
    vif.src=url; vis.showModal();
    clearTimeout(vtimer);
    vtimer=setTimeout(function(){ if(!vurl.dataset.ok){ vurl.textContent=url+'  ·  o site pode bloquear a pré-visualização — use "Abrir ↗"'; } }, 3500);
    vif.onload=function(){ vurl.dataset.ok='1'; };
  }
  function fecharVisor(){ if(!vis) return; try{ vis.close(); }catch(e){} vif.src='about:blank'; delete vurl.dataset.ok; clearTimeout(vtimer); }
  document.addEventListener('click', function(e){
    var t=e.target.closest('[data-visor]');
    if(t){ e.preventDefault(); abrirVisor(t.getAttribute('data-visor')); return; }
    if(e.target.closest('#visor-close')){ fecharVisor(); return; }
    if(e.target.closest('#visor-desktop')){ setModo('desktop'); return; }
    if(e.target.closest('#visor-mobile')){ setModo('mobile'); return; }
  });
  if(vis){ vis.addEventListener('click', function(e){ if(e.target===vis) fecharVisor(); }); vis.addEventListener('close', function(){ vif.src='about:blank'; }); }
})();
</script>
<script type="module">
/* Firestore é a fonte de verdade. Se algo aqui falhar, a página
   permanece de pé com os dados embutidos acima. */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getFirestore, collection, getDocs, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const config = {
  apiKey: "AIzaSyD9juzHnTpUhzUYy84Wa31b6sNT2uSxDVc",
  authDomain: "portfoliopessoal-9aa5b.firebaseapp.com",
  projectId: "portfoliopessoal-9aa5b",
  storageBucket: "portfoliopessoal-9aa5b.firebasestorage.app",
  messagingSenderId: "1011139931499",
  appId: "1:1011139931499:web:961f85dda2a4d9d2a7302e"
};

const bd = getFirestore(initializeApp(config));
try {
  const colecoes = ['capacidades','experiencias','projetos','depoimentos','certificados','clientes','contatos'];
  /* leitura única com limite de tempo: a página não fica presa a um banco lento */
  const [siteSnap, ...snaps] = await Promise.race([
    Promise.all([
      getDoc(doc(bd, 'config', 'site')),
      ...colecoes.map(nome => getDocs(collection(bd, nome)))
    ]),
    new Promise((_, rejeita) => setTimeout(() => rejeita({ code: 'tempo-esgotado' }), 10000))
  ]);
  /* Com config/site no banco, ele já foi populado: coleção vazia é vazia de verdade.
     Sem ela, o banco ainda não recebeu a carga e a semente embutida continua valendo. */
  const semeado = siteSnap.exists();
  const remoto = {};
  if (semeado) remoto.site = siteSnap.data();
  snaps.forEach((snap, i) => {
    if (semeado || !snap.empty) remoto[colecoes[i]] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  });
  window.__hidratar(remoto);
} catch (erro) {
  console.info('[davicjc] Firestore indisponível; exibindo dados embutidos.', erro && erro.code);
}
</script>
