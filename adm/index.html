<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel · davicjc.com</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="../brand/favicon.svg">
<link rel="apple-touch-icon" href="../brand/apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#090C10">
<link rel="stylesheet" href="../assets/css/fontes.css">
<script>
  try {
    var t = localStorage.getItem('davicjc.tema');
    if (t) document.documentElement.setAttribute('data-tema', t);
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-tema', 'escuro');
  } catch (e) {}
</script>
<style>
/* Cores da marca (brand/tokens.json): no claro, o pacote em verde escuro; no escuro, o #46E08C do site. */
:root{
  --tinta:#0B0F14; --tinta-2:#4A5563; --tinta-3:#677281;
  --papel:#F4F6F8; --superficie:#FFFFFF; --superficie-2:#EEF1F4;
  --linha:#E1E6EB; --linha-forte:#C8D0D9;
  --sinal:#1E7B48; --sinal-suave:#E4F3EA; --sinal-forte:#17633A;
  --perigo:#B42318; --perigo-suave:#FDECEA; --alerta:#B45309; --alerta-suave:#FEF3E2;
  --sombra:0 1px 2px rgba(10,22,40,.05), 0 8px 24px -12px rgba(10,22,40,.14);
  --sombra-alta:0 2px 4px rgba(10,22,40,.06), 0 24px 60px -20px rgba(10,22,40,.3);
  --fonte-display:'Archivo', system-ui, sans-serif; --largura-display:112%;
  --fonte-corpo:'IBM Plex Sans', system-ui, sans-serif;
  --fonte-dados:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --raio:9px;
}
:root[data-tema="escuro"]{
  --tinta:#E8EDF2; --tinta-2:#A9B3BF; --tinta-3:#7B8592;
  --papel:#090C10; --superficie:#0F1318; --superficie-2:#151A21;
  --linha:#222A34; --linha-forte:#313B47;
  --sinal:#46E08C; --sinal-suave:#0E2A1C; --sinal-forte:#64EBA3;
  --perigo:#F97066; --perigo-suave:#2A1215; --alerta:#F79009; --alerta-suave:#2A1E0B;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --sombra-alta:0 2px 4px rgba(0,0,0,.5), 0 24px 60px -20px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--papel); color:var(--tinta); font-family:var(--fonte-corpo); font-size:.95rem; line-height:1.55; -webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sinal); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important; animation-duration:.01ms!important}}

.rotulo{font-family:var(--fonte-dados); font-size:.68rem; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--tinta-3)}
.mono{font-family:var(--fonte-dados)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:.45rem; padding:.6rem 1rem; border-radius:8px; border:1px solid var(--linha); background:var(--superficie); font-family:var(--fonte-dados); font-size:.78rem; font-weight:500; transition:border-color .15s, background .15s, color .15s, opacity .15s; white-space:nowrap; text-decoration:none}
.btn:hover{border-color:var(--linha-forte)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn-forte{background:var(--tinta); color:var(--papel); border-color:var(--tinta)}
.btn-forte:hover{background:var(--sinal); border-color:var(--sinal); color:var(--papel)}
.btn-perigo{color:var(--perigo)}
.btn-perigo:hover{border-color:var(--perigo); background:var(--perigo-suave)}
.btn-mini{padding:.34rem .55rem; font-size:.7rem}
.btn svg,.ic svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.ic{width:32px; height:32px; display:inline-grid; place-items:center; border:1px solid var(--linha); border-radius:7px; background:var(--superficie); color:var(--tinta-2); transition:.15s}
.ic:hover{color:var(--sinal); border-color:var(--sinal)}
.ic:disabled{opacity:.35; cursor:not-allowed; color:var(--tinta-3); border-color:var(--linha)}
.ic.perigo:hover{color:var(--perigo); border-color:var(--perigo)}

/* ── login ── */
.login{min-height:100%; display:grid; place-items:center; padding:1.5rem}
.login-caixa{width:100%; max-width:380px}
.login-marca{display:flex; align-items:center; gap:.55rem; font-family:var(--fonte-display); font-weight:800; font-size:1.1rem; letter-spacing:-.03em; margin-bottom:2rem}
.ponto{width:8px; height:8px; border-radius:50%; background:var(--sinal); flex:none}
.marca-d{width:1.05em; height:auto; flex:none}
.login h1{font-family:var(--fonte-display); font-weight:800; font-size:2rem; letter-spacing:-.035em; line-height:1.05; margin:0 0 .5rem}
.login p{color:var(--tinta-2); margin:0 0 1.75rem}
.login form{display:flex; flex-direction:column; gap:1rem}
.login .btn-forte{padding:.8rem; margin-top:.25rem}
.login-rodape{display:flex; justify-content:space-between; margin-top:1.25rem; font-family:var(--fonte-dados); font-size:.74rem}
.login-rodape button,.login-rodape a{color:var(--tinta-3); text-decoration:none}
.login-rodape button:hover,.login-rodape a:hover{color:var(--sinal)}

/* ── campos ── */
.campo{display:flex; flex-direction:column; gap:.35rem; min-width:0; margin:0; border:0; padding:0}
.campo > span, .campo > legend{font-family:var(--fonte-dados); font-size:.7rem; letter-spacing:.06em; color:var(--tinta-2); padding:0}
.campo .ajuda{font-size:.76rem; color:var(--tinta-3); font-family:var(--fonte-corpo); letter-spacing:0}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],textarea,select{
  width:100%; padding:.6rem .75rem; border:1px solid var(--linha); border-radius:8px;
  background:var(--superficie); transition:border-color .15s, box-shadow .15s; min-width:0;
}
textarea{resize:vertical; min-height:96px; line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--sinal); box-shadow:0 0 0 3px var(--sinal-suave)}
.erro-campo{border-color:var(--perigo)!important}
.bi-grade{display:grid; grid-template-columns:1fr 1fr 1fr; gap:.6rem}
@media (max-width:800px){.bi-grade{grid-template-columns:1fr}}
.bi-grade label{display:flex; flex-direction:column; gap:.25rem; min-width:0}
.lang{font-family:var(--fonte-dados); font-size:.6rem; font-weight:600; letter-spacing:.12em; color:var(--tinta-3)}
.chave{display:flex; align-items:center; gap:.6rem; cursor:pointer; user-select:none; padding:.2rem 0}
.chave input{appearance:none; -webkit-appearance:none; width:34px; height:20px; border-radius:99px; background:var(--linha-forte); position:relative; cursor:pointer; transition:background .15s; flex:none; margin:0}
.chave input::after{content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .15s}
.chave input:checked{background:var(--sinal)}
.chave input:checked::after{transform:translateX(14px)}
.chave span{font-size:.86rem}

/* ── app ── */
.app{display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100%}
@media (max-width:860px){.app{grid-template-columns:1fr}}
.lateral{border-right:1px solid var(--linha); background:var(--superficie); padding:1.25rem .75rem; display:flex; flex-direction:column; gap:1.25rem; position:sticky; top:0; height:100vh; overflow:auto}
.lateral .login-marca{margin:0 .5rem .25rem; font-size:1rem}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{display:flex; justify-content:space-between; align-items:center; gap:.5rem; width:100%; text-align:left; padding:.55rem .7rem; border-radius:7px; color:var(--tinta-2); font-size:.88rem; transition:background .15s, color .15s}
.nav button:hover{background:var(--superficie-2); color:var(--tinta)}
.nav button[aria-current="true"]{background:var(--sinal-suave); color:var(--sinal-forte); font-weight:600}
:root[data-tema="escuro"] .nav button[aria-current="true"]{color:var(--sinal)}
.nav em{font-style:normal; font-family:var(--fonte-dados); font-size:.7rem; color:var(--tinta-3)}
.nav-sep{height:1px; background:var(--linha); margin:.5rem .7rem}
.lateral-rodape{margin-top:auto; display:flex; flex-direction:column; gap:.5rem; padding:0 .5rem}
.usuario{font-family:var(--fonte-dados); font-size:.7rem; color:var(--tinta-3); word-break:break-all}
.lateral-acoes{display:flex; gap:.4rem; flex-wrap:wrap}
@media (max-width:860px){
  .lateral{position:sticky; top:0; z-index:20; height:auto; flex-direction:row; align-items:center; padding:.6rem .75rem; gap:.6rem; border-right:0; border-bottom:1px solid var(--linha); overflow-x:auto}
  .lateral .login-marca{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap; padding:.45rem .65rem}
  .nav-sep{display:none}
  .lateral > *{flex:none}
  .lateral-rodape{margin:0 0 0 auto; flex-direction:row; align-items:center; padding:0}
  .lateral-acoes{flex-wrap:nowrap}
  .usuario{display:none}
}

.principal{padding:clamp(1.25rem,3vw,2.5rem); max-width:1080px; width:100%}
.cabeca{display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.5rem}
.cabeca h1{font-family:var(--fonte-display); font-weight:800; font-size:clamp(1.5rem,3vw,2rem); letter-spacing:-.03em; margin:.3rem 0 0}
.cabeca p{margin:.35rem 0 0; color:var(--tinta-2); max-width:62ch; font-size:.9rem}

.lista{border:1px solid var(--linha); border-radius:12px; background:var(--superficie); overflow:hidden}
.item{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:.9rem; align-items:center; padding:.75rem .9rem; border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:none}
.item:hover{background:var(--superficie-2)}
.item.oculto-pub .item-titulo{color:var(--tinta-3)}
.miniatura{width:64px; height:40px; border-radius:5px; background:var(--superficie-2); border:1px solid var(--linha); object-fit:cover; object-position:top; display:block}
.miniatura.redonda{width:40px; border-radius:50%}
.miniatura.vazia{display:grid; place-items:center; font-family:var(--fonte-dados); font-size:.7rem; color:var(--tinta-3)}
.item-texto{min-width:0}
.item-titulo{font-weight:600; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item-sub{font-size:.8rem; color:var(--tinta-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.selos{display:flex; gap:.3rem; flex-wrap:wrap; margin-top:.25rem}
.selo{font-family:var(--fonte-dados); font-size:.6rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:.12rem .4rem; border-radius:4px; background:var(--superficie-2); color:var(--tinta-3)}
.selo.sinal{background:var(--sinal-suave); color:var(--sinal-forte)}
:root[data-tema="escuro"] .selo.sinal{color:var(--sinal)}
.selo.alerta{background:var(--alerta-suave); color:var(--alerta)}
.item-acoes{display:flex; gap:.3rem; align-items:center}
@media (max-width:640px){
  .item{grid-template-columns:auto minmax(0,1fr); }
  .item-acoes{grid-column:1 / -1; justify-content:flex-end}
}
.vazio{padding:2.5rem 1.5rem; text-align:center; color:var(--tinta-3)}

/* ── cartões de ferramentas ── */
.cartoes{display:grid; gap:1rem}
.cartao{border:1px solid var(--linha); border-radius:12px; background:var(--superficie); padding:1.25rem 1.35rem}
.cartao h2{font-family:var(--fonte-display); font-weight:700; font-size:1.1rem; letter-spacing:-.02em; margin:0 0 .35rem}
.cartao p{margin:0 0 1rem; color:var(--tinta-2); font-size:.88rem; max-width:70ch}
.cartao.destaque{border-color:var(--sinal); box-shadow:0 0 0 3px var(--sinal-suave)}
.cartao.aviso{border-color:var(--alerta); background:var(--alerta-suave)}
.cartao.aviso p{color:var(--tinta)}
/* resumo da página inicial: tudo o que está no banco, sem abrir o editor */
.resumo-doc{display:grid; gap:1rem}
.resumo-doc__cabeca{display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:.85rem}
.resumo-doc__cabeca h2{margin:0}
.resumo-doc dl{display:grid; grid-template-columns:minmax(9rem, 15rem) 1fr; gap:.6rem 1.25rem; margin:0; font-size:.86rem}
.resumo-doc dt{font-family:var(--fonte-dados); font-size:.7rem; letter-spacing:.04em; color:var(--tinta-3); padding-top:.15rem}
.resumo-doc dd{margin:0; min-width:0; overflow-wrap:anywhere; color:var(--tinta)}
.resumo-en{display:block; margin-top:.2rem; color:var(--tinta-3); font-size:.8rem}
.resumo-vazio{color:var(--tinta-3)}
.resumo-img{width:72px; height:45px; object-fit:cover; object-position:top; border-radius:5px; border:1px solid var(--linha); vertical-align:middle}
.resumo-grupo{margin:0; padding-left:1.2rem; display:grid; gap:.4rem}
.resumo-grupo .resumo-img{margin-right:.6rem}
@media (max-width:640px){ .resumo-doc dl{grid-template-columns:1fr; gap:.15rem} .resumo-doc dd{margin-bottom:.55rem} }
.cartao ol{margin:0 0 1rem; padding-left:1.2rem; color:var(--tinta-2); font-size:.88rem}
.cartao ol li{margin-bottom:.35rem}
.cartao code, .cartao pre{font-family:var(--fonte-dados); font-size:.76rem}
.cartao pre{background:var(--superficie-2); border:1px solid var(--linha); border-radius:8px; padding:.9rem 1rem; overflow-x:auto; margin:0 0 .75rem; line-height:1.5}
.linha-acoes{display:flex; gap:.5rem; flex-wrap:wrap}
.metricas{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:1px; background:var(--linha); border:1px solid var(--linha); border-radius:10px; overflow:hidden; margin-bottom:1rem}
.metricas div{background:var(--superficie); padding:.75rem .9rem}
.metricas b{display:block; font-family:var(--fonte-display); font-size:1.35rem; letter-spacing:-.02em}
.metricas span{font-family:var(--fonte-dados); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--tinta-3)}

/* ── editor ── */
.fundo{position:fixed; inset:0; background:color-mix(in srgb, var(--tinta) 30%, transparent); z-index:50; opacity:0; transition:opacity .2s}
.fundo.aberto{opacity:1}
.editor{position:fixed; top:0; right:0; bottom:0; width:min(680px,100vw); background:var(--papel); border-left:1px solid var(--linha); z-index:51; display:flex; flex-direction:column; box-shadow:var(--sombra-alta); transform:translateX(100%); transition:transform .25s cubic-bezier(.3,0,.2,1)}
.editor.aberto{transform:none}
.editor-topo{display:flex; align-items:center; gap:.75rem; padding:.9rem 1.25rem; border-bottom:1px solid var(--linha); background:var(--superficie)}
.editor-topo h2{font-family:var(--fonte-display); font-weight:700; font-size:1.05rem; letter-spacing:-.02em; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.editor-corpo{flex:1; overflow:auto; padding:1.25rem; display:flex; flex-direction:column; gap:1.1rem}
.editor-rodape{display:flex; align-items:center; justify-content:flex-end; gap:.6rem; padding:.85rem 1.25rem; border-top:1px solid var(--linha); background:var(--superficie)}
.sujo{margin-right:auto; font-family:var(--fonte-dados); font-size:.72rem; color:var(--alerta); display:flex; align-items:center; gap:.4rem}
.sujo::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor}
.grupo-form{border:1px solid var(--linha); border-radius:10px; padding:1rem; display:flex; flex-direction:column; gap:.9rem; background:var(--superficie)}
.grupo-form > .rotulo{margin-bottom:-.2rem}
.secao-form{font-family:var(--fonte-display); font-weight:700; font-size:.95rem; letter-spacing:-.01em; margin:.75rem 0 -.25rem; padding-top:.9rem; border-top:1px solid var(--linha)}
.secao-form:first-child{margin-top:0; padding-top:0; border-top:0}
.linhas-grupo{display:flex; flex-direction:column; gap:.6rem}
.linha-grupo{border:1px solid var(--linha); border-radius:9px; padding:.8rem; display:flex; flex-direction:column; gap:.7rem; background:var(--papel)}
.linha-grupo-topo{display:flex; justify-content:space-between; align-items:center}
.linha-grupo-topo .acoes{display:flex; gap:.25rem}
.linha-grupo .ic{width:28px; height:28px}
.duas{display:grid; grid-template-columns:1fr 1fr; gap:.8rem}
@media (max-width:640px){.duas{grid-template-columns:1fr}}

.imagem-campo{display:grid; grid-template-columns:160px minmax(0,1fr); gap:.9rem; align-items:start}
@media (max-width:560px){.imagem-campo{grid-template-columns:1fr}}
.previa{width:100%; aspect-ratio:16/10; border-radius:8px; border:1px solid var(--linha); background:var(--superficie-2); object-fit:cover; object-position:top; display:block}
.previa.redonda{aspect-ratio:1; border-radius:50%; max-width:96px}
.previa-vazia{display:grid; place-items:center; font-family:var(--fonte-dados); font-size:.7rem; color:var(--tinta-3)}
.imagem-acoes{display:flex; flex-direction:column; gap:.5rem}
.enviando{font-family:var(--fonte-dados); font-size:.72rem; color:var(--tinta-3)}

/* ── avisos ── */
.avisos{position:fixed; left:50%; top:1rem; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:.5rem; align-items:center; pointer-events:none; width:min(92vw,520px)}
.aviso-item{pointer-events:auto; background:var(--tinta); color:var(--papel); padding:.7rem 1rem; border-radius:9px; font-size:.86rem; box-shadow:var(--sombra-alta); display:flex; gap:.6rem; align-items:flex-start; animation:entra .2s ease}
.aviso-item.erro{background:var(--perigo); color:#fff}
.aviso-item.ok::before{content:'✓'; color:var(--sinal)}
:root[data-tema="escuro"] .aviso-item.ok::before{color:#046C4A}
@keyframes entra{from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:none}}

.carregando{display:flex; align-items:center; gap:.6rem; color:var(--tinta-3); font-family:var(--fonte-dados); font-size:.8rem; padding:2rem 0}
.giro{width:14px; height:14px; border:2px solid var(--linha-forte); border-top-color:var(--sinal); border-radius:50%; animation:giro .7s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.msg-erro{color:var(--perigo); font-size:.84rem; min-height:1.2em}
.login h1,.cabeca h1,.cartao h2,.editor-topo h2,.secao-form,.login-marca,.metricas b{font-stretch:var(--largura-display)}

/* ── prévia de importação ── */
.previa-imp{margin-top:1rem; padding-top:1rem; border-top:1px solid var(--linha)}
.previa-imp p{margin:.35rem 0 .75rem}
.previa-imp.erro b{color:var(--perigo)}
.previa-tabela{max-height:340px; overflow:auto; border:1px solid var(--linha); border-radius:8px; margin-bottom:.9rem}
.previa-tabela table{width:100%; border-collapse:collapse; font-size:.8rem}
.previa-tabela th{position:sticky; top:0; background:var(--superficie-2); text-align:left; font-family:var(--fonte-dados); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--tinta-3); padding:.45rem .6rem}
.previa-tabela td{padding:.4rem .6rem; border-top:1px solid var(--linha); vertical-align:top}
.previa-tabela td.mono{font-size:.74rem; word-break:break-word}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<section class="login" id="tela-login" hidden>
  <div class="login-caixa">
    <div class="login-marca"><svg class="marca-d" viewBox="20 12 66 76" aria-hidden="true"><path d="M30 39V22H48A28 28 0 0 1 48 78H30V61" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round"/><circle cx="30" cy="50" r="7" style="fill:var(--sinal)"/></svg>davi castro</div>
    <h1>Painel do portfólio</h1>
    <p>Entre para editar projetos, trajetória, depoimentos e o resto do site.</p>
    <form id="form-login" novalidate>
      <label class="campo"><span>e-mail</span><input type="email" id="login-email" autocomplete="username" required></label>
      <label class="campo"><span>senha</span><input type="password" id="login-senha" autocomplete="current-password" required></label>
      <div class="msg-erro" id="login-erro" role="alert"></div>
      <button class="btn btn-forte" id="login-botao" type="submit">Entrar</button>
    </form>
    <div class="login-rodape">
      <button type="button" id="esqueci">esqueci a senha</button>
      <a href="../">voltar ao site ↗</a>
    </div>
  </div>
</section>

<!-- ═══ APP ═══ -->

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const clonar = o => JSON.parse(JSON.stringify(o ?? null));
const ordenar = l => (l||[]).slice().sort((a,b) => (a.ordem||0) - (b.ordem||0));
function secao(id){ return SECOES.find(s => s.id === id); }

function ler(obj, caminho){
  return caminho.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function definir(obj, caminho, valor){
  const partes = caminho.split('.');
  let o = obj;
  for (let i = 0; i < partes.length - 1; i++){
    const k = partes[i];
    if (o[k] == null) o[k] = /^\d+$/.test(partes[i+1]) ? [] : {};
    o = o[k];
  }
  o[partes[partes.length - 1]] = valor;
}
/* caminhos relativos ao site (fotos/...) precisam de "../" dentro de /adm */
function urlPrevia(u){
  if (!u) return '';
  if (/^(https?:|data:image\/)/i.test(u)) return u;
  if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
  return '../' + u.replace(/^\/+/, '');
}
function slug(t){
  return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
}
function comTempo(promessa, ms, msg){
  return Promise.race([promessa, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error(msg), { code:'tempo-esgotado' })), ms))]);
}

function avisar(texto, tipo = 'ok', ms = 3200){
  const el = document.createElement('div');
  el.className = 'aviso-item ' + tipo;
  el.textContent = texto;
  $('#avisos').appendChild(el);
  setTimeout(() => el.remove(), tipo === 'erro' ? Math.max(ms, 6500) : ms);
}

/* Traduz os erros do Firebase para algo que diga o que fazer. */
function explicarErro(e){
  const c = (e && e.code) || '';
  const m = (e && e.message) || '';
  if (e instanceof TypeError && /failed to fetch|networkerror|load failed/i.test(m))
    return 'O navegador bloqueou uma requisição de rede. Verifique a internet; se abriu o painel direto do arquivo, use um servidor local ou o site publicado.';
  if (/does not exist|NOT_FOUND/i.test(m) || c === 'not-found')
    return 'O banco Firestore ainda não foi criado neste projeto. Crie em Firestore Database → Criar banco de dados.';
  const mapa = {
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/invalid-login-credentials':'E-mail ou senha incorretos.',
    'auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/invalid-email':'Esse e-mail não parece válido.',
    'auth/missing-password':'Digite a senha.',
    'auth/too-many-requests':'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.',
    'auth/network-request-failed':'Sem conexão com o Firebase. Verifique a internet.',
    'auth/operation-not-allowed':'O login por e-mail e senha está desativado. Ative em Authentication → Sign-in method → E-mail/senha.',
    'auth/configuration-not-found':'O Firebase Authentication ainda não foi ativado neste projeto. Ative em Authentication → Começar.',
    'auth/unauthorized-domain':'Este domínio não está autorizado. Adicione-o em Authentication → Configurações → Domínios autorizados.',
    'permission-denied':'Sem permissão. Confira se as regras do Firestore liberam escrita para ' + EMAIL_ADMIN + '.',
    'unavailable':'O Firestore não respondeu. Verifique a conexão e tente de novo.',
    'tempo-esgotado':'O Firestore demorou demais para responder. Se o banco ainda não foi criado, crie em Firestore Database.',
    'storage/unauthorized':'Sem permissão para enviar arquivos ao Storage.',
  };
  return mapa[c] || ('Erro inesperado' + (c ? ' (' + c + ')' : '') + '. ' + m.replace(/^Firebase:\s*/,'').slice(0,160));
}

  const h = location.hash.replace('#','');
  if (secao(h)) estado.secao = h;

  await carregarTudo();
});

    await signInWithEmailAndPassword(auth, $('#login-email').value.trim(), $('#login-senha').value);

    $('#login-erro').textContent = explicarErro(e);
  } finally {
    botao.disabled = false; botao.textContent = 'Entrar';
  }
});
$('#esqueci').addEventListener('click', async () => {
  const email = $('#login-email').value.trim();
  if (!email){ $('#login-erro').textContent = 'Digite seu e-mail acima e clique de novo para receber o link.'; $('#login-email').focus(); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    $('#login-erro').textContent = '';
    avisar('Se esse e-mail tiver conta, o link de nova senha chega em instantes.');
  } catch (e) { $('#login-erro').textContent = explicarErro(e); }
});
$('#sair').addEventListener('click', async () => {
  if (estado.sujo && !confirm('Há alterações não salvas. Sair mesmo assim?')) return;
  fecharEditor(true);
  await signOut(auth);
});
$('#tema').addEventListener('click', () => {
  const novo = document.documentElement.getAttribute('data-tema') === 'escuro' ? 'claro' : 'escuro';
  document.documentElement.setAttribute('data-tema', novo);
  try { localStorage.setItem('davicjc.tema', novo); } catch (e) {}
});

/* ══════════════ LEITURA ══════════════ */
async function carregarTudo(){
  estado.carregado = false; estado.erroCarga = null;
  renderPrincipal();
  try {
    const [siteSnap, ...snaps] = await comTempo(Promise.all([
      getDoc(doc(bd, 'config', 'site')),
      ...TODAS.map(c => getDocs(collection(bd, c))),
    ]), 15000, 'tempo esgotado');
    estado.dados.site = siteSnap.exists() ? siteSnap.data() : null;
    snaps.slice(0, TODAS.length).forEach((s, i) => { estado.dados[TODAS[i]] = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })); });
    estado.carregado = true;
    if (bancoVazio() && estado.secao !== 'banco'){ estado.secao = 'banco'; }
  } catch (e) {
    estado.erroCarga = e;
  }
  renderNav();
  renderPrincipal();
}
function totalDocs(){ return TODAS.reduce((n, c) => n + estado.dados[c].length, 0) + (estado.dados.site ? 1 : 0); }
function bancoVazio(){ return totalDocs() === 0; }

/* ══════════════ NAVEGAÇÃO ══════════════ */
function renderNav(){
  const html = SECOES.map(s => {
    const n = s.doc || s.ferramentas ? '' : s.pedidos ? (estado.pedidos ? estado.pedidos.length : '') : (estado.carregado ? estado.dados[s.id].length : '');
    const sep = s.ferramentas ? '<div class="nav-sep"></div>' : '';
    return sep + `<button data-ir="${s.id}" aria-current="${estado.secao === s.id}">${esc(s.nome)}<em>${n}</em></button>`;
  }).join('');
  $('#nav').innerHTML = html;
}
$('#nav').addEventListener('click', ev => {
  const b = ev.target.closest('[data-ir]');
  if (!b) return;
  if (estado.editando && estado.sujo && !confirm('Há alterações não salvas. Descartar?')) return;
  fecharEditor(true);
  estado.secao = b.dataset.ir;
  history.replaceState(null, '', '#' + estado.secao);
  renderNav(); renderPrincipal();
  window.scrollTo(0, 0);
});

/* ══════════════ TELA PRINCIPAL ══════════════ */
function renderPrincipal(){
  const alvo = $('#principal');
  const s = secao(estado.secao);

  if (estado.erroCarga){
    alvo.innerHTML = cabecalho('Algo impediu a leitura do banco', '') +
      `<div class="cartao aviso"><p>${esc(explicarErro(estado.erroCarga))}</p>
       <div class="linha-acoes"><button class="btn btn-forte" data-acao="recarregar">Tentar de novo</button>
       <a class="btn" href="${CONSOLE}/firestore" target="_blank" rel="noopener">Abrir o Firestore no console ↗</a></div></div>`;
    return;
  }
  if (!estado.carregado){
    alvo.innerHTML = `<div class="carregando"><span class="giro"></span>lendo o banco…</div>`;
    return;
  }
  if (s.ferramentas) return renderFerramentas(alvo);
  if (s.pedidos) return renderPedidos(alvo);
  if (s.doc) return renderDocumento(alvo, s);
  renderLista(alvo, s);
}

/* ══════════════ PEDIDOS ══════════════
   Lidos sob demanda (não entram em TODAS): assim nunca vão para a cópia de segurança,
   para a importação nem para o data/firestore.json do build. */
async function renderPedidos(alvo){
  const s = secao('pedidos');
  alvo.innerHTML = cabecalho(s.nome, s.descricao, `<button class="btn" data-acao-ped="recarregar">Atualizar</button>`) + `<div class="carregando"><span class="giro"></span>lendo os pedidos…</div>`;
  try {
    const snap = await comTempo(getDocs(collection(bd, 'pedidos')), 15000, 'tempo esgotado');
    estado.pedidos = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })).sort((a, b) => String(b.criado_em || '').localeCompare(String(a.criado_em || '')));
  } catch (e) {
    alvo.innerHTML = cabecalho(s.nome, s.descricao) + `<div class="cartao aviso"><p>${esc(explicarErro(e))}</p></div>`;
    return;
  }
  renderNav();
  const lista = estado.pedidos;
  const data = iso => { try { return new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(iso)); } catch (e) { return iso || ''; } };
  const zap = t => 'https://wa.me/' + String(t || '').replace(/\D/g, '').replace(/^(?!55)(\d{10,11})$/, '55$1');
  alvo.innerHTML = cabecalho(s.nome, s.descricao, `<button class="btn" data-acao-ped="recarregar">Atualizar</button>`) +
    (!lista.length
      ? `<div class="cartao"><h2>Nenhum pedido no banco</h2><p>A página /pedido/ só grava aqui quando <code>gravar_no_firestore</code> está <code>true</code> em <code>data/pedido.json</code>, e isso só deve ser ligado depois de publicar as regras de <code>firestore.rules</code> (sem elas, a leitura do banco é pública). Até lá, os pedidos chegam pelo WhatsApp ou e-mail.</p></div>`
      : lista.map(p => `<div class="cartao" style="margin-bottom:12px">
          <span class="rotulo">${esc(p.protocolo || p.id)} · ${esc(p.modo === 'rapido' ? 'análise rápida' : 'análise completa')} · ${esc(data(p.criado_em))}</span>
          <h2>${esc(p.nome || '')}${p.empresa ? ' · ' + esc(p.empresa) : ''}</h2>
          <p>${esc(p.email || '')} · ${esc(p.telefone || '')}${p.cnpj ? ' · CNPJ ' + esc(p.cnpj) : ''}</p>
          <details><summary class="rotulo" style="cursor:pointer;margin-bottom:.6rem">ver o pedido inteiro</summary><pre style="white-space:pre-wrap">${esc(p.resumo || '')}</pre></details>
          <div class="linha-acoes">
            <a class="btn btn-forte" href="${esc(zap(p.telefone))}" target="_blank" rel="noopener">Responder no WhatsApp</a>
            <a class="btn" href="mailto:${esc(p.email || '')}?subject=${encodeURIComponent('Seu pedido ' + (p.protocolo || ''))}">Responder por e-mail</a>
            <button class="btn" data-acao-ped="apagar" data-id="${esc(p.id)}">Apagar</button>
          </div></div>`).join(''));
  alvo.querySelectorAll('[data-acao-ped]').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.acaoPed === 'recarregar') return renderPedidos(alvo);
    if (!confirm('Apagar este pedido de vez?')) return;
    await deleteDoc(doc(bd, 'pedidos', b.dataset.id));
    renderPedidos(alvo);
  }));
}

function cabecalho(titulo, descricao, acoes = ''){
  return `<div class="cabeca"><div><span class="rotulo">davicjc.com · painel</span><h1>${esc(titulo)}</h1>${descricao ? `<p>${esc(descricao)}</p>` : ''}</div>${acoes}</div>`;
}

function renderDocumento(alvo, s){
  const site = estado.dados.site;
  const topo = cabecalho(s.nome, s.descricao, `<button class="btn btn-forte" data-acao="editar-site">Editar página inicial</button>`);
  if (!site){
    alvo.innerHTML = topo + `<div class="cartao aviso"><p>A página inicial ainda não existe no banco. Importe uma cópia em “Banco e publicação” ou clique em editar para criá-la do zero.</p></div>`;
    return;
  }
  // Tudo o que está no banco, separado pelas mesmas seções do formulário. Campo vazio aparece como "—".
  const blocos = [];
  for (const c of s.campos){
    if (c.secao){ blocos.push({ titulo: c.secao, linhas: [] }); continue; }
    if (!blocos.length) blocos.push({ titulo: '', linhas: [] });
    blocos[blocos.length - 1].linhas.push(`<dt>${esc(c.rotulo)}</dt><dd>${resumoCampo(c, site)}</dd>`);
  }
  alvo.innerHTML = topo + `<div class="resumo-doc">${blocos.map(b => `<section class="cartao">
      <div class="resumo-doc__cabeca"><h2>${esc(b.titulo)}</h2><button class="btn btn-mini" data-acao="editar-site">Editar</button></div>
      <dl>${b.linhas.join('')}</dl></section>`).join('')}</div>`;
}

const semValor = '<span class="resumo-vazio">—</span>';
function resumoCampo(c, obj){
  const v = obj[c.k];
  switch (c.tipo){
    case 'bi': case 'bi-longo': {
      const pt = obj[c.k + '_pt'], en = obj[c.k + '_en'];
      if (!pt && !en) return semValor;
      return `${pt ? esc(pt) : semValor}${en ? `<span class="resumo-en">EN · ${esc(en)}</span>` : ''}`;
    }
    case 'bool': return v ? 'Sim' : 'Não';
    case 'select': { const op = (c.opcoes || []).find(([k]) => k === (v ?? '')); return op ? esc(op[1]) : (v ? esc(v) : semValor); }
    case 'lista': case 'linhas': return Array.isArray(v) && v.length ? esc(v.join(', ')) : semValor;
    case 'caminho-imagem': { const u = urlPrevia(v); return u ? `<img class="resumo-img" src="${esc(u)}" alt="" loading="lazy">` : semValor; }
    case 'grupo': {
      if (!Array.isArray(v) || !v.length) return semValor;
      const img = c.campos.find(x => x.tipo === 'caminho-imagem');
      return `<ol class="resumo-grupo">${v.map(item => {
        const u = img ? urlPrevia(item[img.k]) : '';
        const textos = c.campos.filter(x => ['texto', 'url', 'bi'].includes(x.tipo))
          .map(x => x.tipo === 'bi' ? item[x.k + '_pt'] : item[x.k]).filter(Boolean);
        return `<li>${u ? `<img class="resumo-img" src="${esc(u)}" alt="" loading="lazy">` : ''}${textos.length ? esc(textos.join(' · ')) : semValor}</li>`;
      }).join('')}</ol>`;
    }
    default: return v != null && v !== '' ? esc(String(v)) : semValor;
  }
}

function renderLista(alvo, s){
  const itens = ordenar(estado.dados[s.id]);
  let h = cabecalho(s.nome, s.descricao, `<button class="btn btn-forte" data-acao="novo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Novo</button>`);
  if (!itens.length){
    h += `<div class="lista"><div class="vazio">Nada aqui ainda. Use “Novo” para adicionar${bancoVazio() ? ', ou importe uma cópia em “Banco e publicação”' : ''}.</div></div>`;
    alvo.innerHTML = h; return;
  }
  h += '<div class="lista">';
  itens.forEach((it, i) => {
    const img = s.imagem ? urlPrevia(s.imagem(it)) : '';
    const mini = s.imagem
      ? (img ? `<img class="miniatura${s.redonda ? ' redonda' : ''}" src="${esc(img)}" alt="" loading="lazy">`
             : `<span class="miniatura vazia${s.redonda ? ' redonda' : ''}">—</span>`)
      : `<span class="miniatura vazia mono" style="width:32px">${String(i+1).padStart(2,'0')}</span>`;
    const selos = (s.selos ? s.selos(it) : []).filter(Boolean)
      .concat(it.publicado === false ? [['rascunho','alerta']] : [])
      .map(([t, cl]) => `<span class="selo ${cl||''}">${esc(t)}</span>`).join('');
    h += `<div class="item${it.publicado === false ? ' oculto-pub' : ''}">
      ${mini}
      <div class="item-texto">
        <div class="item-titulo">${esc(s.titulo(it) || '(sem título)')}</div>
        <div class="item-sub">${esc(s.sub ? s.sub(it) : '')}</div>
        ${selos ? `<div class="selos">${selos}</div>` : ''}
      </div>
      <div class="item-acoes">
        <button class="ic" data-acao="subir" data-id="${esc(it.id)}" title="Subir" aria-label="Subir" ${i === 0 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
        <button class="ic" data-acao="descer" data-id="${esc(it.id)}" title="Descer" aria-label="Descer" ${i === itens.length - 1 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="ic" data-acao="publicar" data-id="${esc(it.id)}" title="${it.publicado === false ? 'Publicar' : 'Ocultar do site'}" aria-label="${it.publicado === false ? 'Publicar' : 'Ocultar do site'}">
          ${it.publicado === false
            ? '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19M1 1l22 22"/></svg>'
            : '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'}
        </button>
        <button class="ic" data-acao="editar" data-id="${esc(it.id)}" title="Editar" aria-label="Editar"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="ic perigo" data-acao="excluir" data-id="${esc(it.id)}" title="Excluir" aria-label="Excluir"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      </div>
    </div>`;
  });
  h += '</div>';
  alvo.innerHTML = h;
}

/* ══════════════ AÇÕES DA LISTA ══════════════ */
$('#principal').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-acao]');
  if (!b || b.disabled) return;
  const s = secao(estado.secao);
  const id = b.dataset.id;
  const acao = b.dataset.acao;
  try {
    if (acao === 'recarregar') return carregarTudo();
    if (acao === 'novo') return abrirEditor(s, null);
    if (acao === 'editar') return abrirEditor(s, id);
    if (acao === 'editar-site') return abrirEditor(s, 'site');
    if (acao === 'excluir') return excluir(s, id);
    if (acao === 'publicar') return alternarPublicado(s, id);
    if (acao === 'subir' || acao === 'descer') return mover(s, id, acao === 'subir' ? -1 : 1);
    if (acao === 'exportar') return exportar();
    if (acao === 'gravar-importacao') return gravarImportacao(b);
    if (acao === 'cancelar-importacao'){ estado.importacao = null; return renderPrincipal(); }
    if (acao === 'copiar-regras') return copiar(b.dataset.alvo);
  } catch (e) { avisar(explicarErro(e), 'erro'); }
});

async function excluir(s, id){
  const it = estado.dados[s.id].find(x => x.id === id);
  if (!it) return;
  if (!confirm(`Excluir “${s.titulo(it) || id}”? Isso não pode ser desfeito.`)) return;
  await deleteDoc(doc(bd, s.id, id));
  estado.dados[s.id] = estado.dados[s.id].filter(x => x.id !== id);
  renderNav(); renderPrincipal();
  avisar('Excluído.');
}

async function alternarPublicado(s, id){
  const it = estado.dados[s.id].find(x => x.id === id);
  const novo = it.publicado === false;
  await setDoc(doc(bd, s.id, id), { publicado: novo }, { merge:true });
  it.publicado = novo;
  renderPrincipal();
  avisar(novo ? 'Marcado como publicado. Entra no site na próxima atualização.' : 'Marcado como oculto. Sai do site na próxima atualização.', 'ok', 5000);
}

async function mover(s, id, passo){
  const lista = ordenar(estado.dados[s.id]);
  const i = lista.findIndex(x => x.id === id);
  const j = i + passo;
  if (j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
  const lote = writeBatch(bd);
  let mudou = 0;
  lista.forEach((it, k) => {
    if (it.ordem !== k + 1){ it.ordem = k + 1; lote.set(doc(bd, s.id, it.id), { ordem: k + 1 }, { merge:true }); mudou++; }
  });
  if (mudou) await lote.commit();
  renderPrincipal();
}

/* ══════════════ EDITOR ══════════════ */
function abrirEditor(s, id){
  let base;
  if (s.doc) base = clonar(estado.dados.site) || {};
  else if (id) base = clonar(estado.dados[s.id].find(x => x.id === id));
  else {
    const maior = Math.max(0, ...estado.dados[s.id].map(x => x.ordem || 0));
    base = Object.assign(clonar(s.novo || {}), { ordem: maior + 1 });
  }
  estado.editando = { secao: s.id, id: s.doc ? 'site' : id };
  estado.rascunho = base;
  estado.sujo = false;
  $('#editor-titulo').textContent = s.doc ? 'Página inicial' : id ? (s.titulo(base) || 'Editar') : 'Novo · ' + s.nome.toLowerCase();
  renderFormulario();
  $('#sujo').hidden = true;
  clearTimeout(temporizadorFechar);          /* um fechamento anterior não pode esconder este editor */
  $('#fundo').hidden = false; $('#editor').hidden = false;
  requestAnimationFrame(() => { $('#fundo').classList.add('aberto'); $('#editor').classList.add('aberto'); });
  setTimeout(() => { const p = $('#editor-corpo').querySelector('input,textarea,select'); if (p) p.focus(); }, 260);
}

let temporizadorFechar = null;
function fecharEditor(forcar){
  if (!estado.editando) return true;
  if (!forcar && estado.sujo && !confirm('Descartar as alterações não salvas?')) return false;
  $('#fundo').classList.remove('aberto'); $('#editor').classList.remove('aberto');
  clearTimeout(temporizadorFechar);
  temporizadorFechar = setTimeout(() => { $('#fundo').hidden = true; $('#editor').hidden = true; }, 250);
  estado.editando = null; estado.rascunho = null; estado.sujo = false;
  return true;
}
$('#editor-fechar').addEventListener('click', () => fecharEditor());
$('#editor-cancelar').addEventListener('click', () => fecharEditor());
$('#fundo').addEventListener('click', () => fecharEditor());
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && estado.editando) fecharEditor();
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's' && estado.editando){ ev.preventDefault(); salvar(); }
});
window.addEventListener('beforeunload', ev => { if (estado.sujo){ ev.preventDefault(); ev.returnValue = ''; } });

function marcarSujo(){ if (!estado.sujo){ estado.sujo = true; $('#sujo').hidden = false; } }

function renderFormulario(){
  const s = secao(estado.editando.secao);
  const corpo = $('#editor-corpo');
  const rolagem = corpo.scrollTop;
  corpo.innerHTML = s.campos.map(c => renderCampo(c, estado.rascunho, '')).join('');
  corpo.scrollTop = rolagem;
}

function atualizarPrevia(caminho, valor){
  const alvo = $('#editor-corpo').querySelector(`[data-previa="${CSS.escape(caminho)}"]`);
  if (!alvo) return;
  const url = urlPrevia(valor);
  const novo = document.createElement(url ? 'img' : 'div');
  novo.className = url ? 'previa' : 'previa previa-vazia';
  novo.dataset.previa = caminho;
  if (url){ novo.src = url; novo.alt = ''; novo.onerror = () => { novo.replaceWith(Object.assign(document.createElement('div'), { className:'previa previa-vazia', textContent:'arquivo não encontrado' })); }; }
  else novo.textContent = 'sem imagem';
  alvo.replaceWith(novo);
}

/* Rascunho de tradução para o inglês; revise antes de salvar (o site é lido por recrutadores de fora). */
window.traduzirCampo = async function(caminho) {
  const ptEl = document.querySelector(`[data-caminho="${CSS.escape(caminho + '_pt')}"]`);
  const enEl = document.querySelector(`[data-caminho="${CSS.escape(caminho + '_en')}"]`);
  if (!ptEl || !enEl) return;
  if (!ptEl.value) return avisar('Preencha o campo em português primeiro.', 'erro');
  avisar('Traduzindo…');
  try {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=pt&tl=en&dt=t&q=${encodeURIComponent(ptEl.value)}`);
    const json = await r.json();
    enEl.value = json[0].map(x => x[0]).join('');
    enEl.dispatchEvent(new Event('input', { bubbles: true }));
    avisar('Tradução pronta. Revise antes de salvar.');
  } catch (err) {
    avisar('Não consegui traduzir agora.', 'erro');
  }
};

function renderCampo(c, obj, base){
  if (c.secao) return `<div class="secao-form">${esc(c.secao)}</div>`;
  const caminho = base + c.k;
  const v = obj ? obj[c.k] : undefined;
  const obrig = c.obrigatorio ? ' *' : '';
  const ajuda = c.ajuda ? `<div class="ajuda">${esc(c.ajuda)}</div>` : '';

  switch (c.tipo){
    case 'texto':
    case 'url': {
      const temDatalist = c.datalist && obj && estado.dados;
      const extraDl = temDatalist ? `<datalist id="dl_${c.k}">${c.datalist().map(op => `<option value="${esc(op)}">`).join('')}</datalist>` : '';
      const attrList = temDatalist ? `list="dl_${c.k}"` : '';
      return `<label class="campo"><span>${esc(c.rotulo)}${obrig}</span>
        <input type="${c.tipo === 'url' ? 'url' : 'text'}" ${c.tipo === 'url' ? 'inputmode="url" placeholder="https://"' : ''} data-caminho="${caminho}" value="${esc(v ?? '')}" ${attrList}>${ajuda}</label>${extraDl}`;
    }
    case 'bi':
    case 'bi-longo': {
      const longo = c.tipo === 'bi-longo';
      const par = lang => {
        const val = esc((obj && obj[c.k + '_' + lang]) ?? '');
        return `<label><span class="lang">${lang.toUpperCase()}</span>${longo
          ? `<textarea data-caminho="${caminho}_${lang}" rows="4">${val}</textarea>`
          : `<input type="text" data-caminho="${caminho}_${lang}" value="${val}">`}</label>`;
      };

              <button class="ic" type="button" data-grupo="descer" data-caminho="${caminho}" data-i="${i}" aria-label="Descer" ${i === v.length - 1 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
              <button class="ic perigo" type="button" data-grupo="remover" data-caminho="${caminho}" data-i="${i}" aria-label="Remover"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            </span></div>
          ${c.campos.map(sc => renderCampo(sc, linha, caminho + '.' + i + '.')).join('')}

    }
  }
  return '';
}

function aoEditar(ev){
  const el = ev.target;
  if (!el.dataset || !el.dataset.caminho || !estado.rascunho) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.tipo === 'lista') v = v.split(',').map(x => x.trim()).filter(Boolean);
  if (el.dataset.tipo === 'linhas') v = v.split('\n').map(x => x.trim()).filter(Boolean);
  if (el.dataset.tipo === 'caminho') v = v.trim();
  definir(estado.rascunho, el.dataset.caminho, v);
  if (el.dataset.tipo === 'caminho') atualizarPrevia(el.dataset.caminho, v);
  el.classList.remove('erro-campo');
  marcarSujo();
}

/* grupos: adicionar, remover, reordenar linhas */
$('#editor-corpo').addEventListener('click', ev => {
  const g = ev.target.closest('[data-grupo]');
  if (g && !g.disabled){
    const caminho = g.dataset.caminho;
    const lista = ler(estado.rascunho, caminho) || [];
    const i = Number(g.dataset.i);
    const s = secao(estado.editando.secao);
    if (g.dataset.grupo === 'adicionar'){
      const def = acharCampo(s.campos, caminho);
      lista.push(clonar(def && def.novo ? def.novo : {}));
    }
    if (g.dataset.grupo === 'remover') lista.splice(i, 1);
    if (g.dataset.grupo === 'subir' && i > 0) [lista[i-1], lista[i]] = [lista[i], lista[i-1]];
    if (g.dataset.grupo === 'descer' && i < lista.length - 1) [lista[i+1], lista[i]] = [lista[i], lista[i+1]];
    definir(estado.rascunho, caminho, lista);
    marcarSujo();
    renderFormulario();
    return;
  }
  const rm = ev.target.closest('[data-remover-imagem]');
  if (rm){
    definir(estado.rascunho, rm.dataset.removerImagem, '');

});
function acharCampo(campos, caminho){
  const k = caminho.split('.').filter(p => !/^\d+$/.test(p)).pop();
  for (const c of campos){
    if (c.k === k) return c;
    if (c.campos){ const r = acharCampo(c.campos, k); if (r) return r; }
  }
  return null;
}

/* ── imagens: comprime no navegador; tenta o Storage, cai para o banco ── */
$('#editor-corpo').addEventListener('change', async ev => {
  const inp = ev.target.closest('[data-enviar]');
  if (!inp || !inp.files || !inp.files[0]) return;
  const caminho = inp.dataset.enviar;
  const status = $(`[data-status="${CSS.escape(caminho)}"]`);
  const arquivo = inp.files[0];
  try {
    if (status) status.textContent = 'comprimindo…';
    const blob = await comprimir(arquivo, Number(inp.dataset.largura) || 1200);
    let url;
    try {
      if (inp.dataset.base64 === 'true') throw new Error('force-base64');
      if (status) status.textContent = 'enviando.';
      const nome = 'portfolio/' + estado.editando.secao + '/' + (slug(arquivo.name.replace(/\.[^.]+$/, '')) || 'imagem') + '-' + Date.now().toString(36) + (blob.type === 'image/webp' ? '.webp' : '.jpg');
      const r = ref(getStorage(app), nome);
      await comTempo(uploadBytes(r, blob, { contentType: blob.type, cacheControl: 'public,max-age=31536000' }), 20000, 'tempo esgotado');
      url = await getDownloadURL(r);
    } catch (erroStorage) {
      /* Sem Storage ativo (plano gratuito) ou flag base64 ativada: guarda a imagem comprimida no próprio documento. */
      if (blob.size > 300 * 1024) throw new Error('A imagem ficou com ' + Math.round(blob.size / 1024) + 'KB mesmo comprimida. Use uma imagem menor.');
      url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
      if (erroStorage.message !== 'force-base64') avisar('Storage indisponível: a imagem foi guardada direto no banco (' + Math.round(blob.size / 1024) + 'KB).');
    }
    definir(estado.rascunho, caminho, url);
    marcarSujo(); renderFormulario();
  } catch (e) {
    if (status) status.textContent = '';
    avisar(e.code || e instanceof TypeError ? explicarErro(e) : e.message, 'erro');
  }
});

async function comprimir(arquivo, larguraMax){
  const bmp = await createImageBitmap(arquivo);
  const escala = Math.min(1, larguraMax / bmp.width);
  const w = Math.round(bmp.width * escala), h = Math.round(bmp.height * escala);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
  const gerar = (tipo, q) => new Promise(r => canvas.toBlob(r, tipo, q));
  let blob = await gerar('image/webp', .8);
  if (!blob || blob.type !== 'image/webp') blob = await gerar('image/jpeg', .82);   /* Safari antigo */
  return blob;
}

/* ── salvar ── */
function validar(s, obj){
  const faltando = [];
  (function varre(campos, o, base){
    campos.forEach(c => {
      if (!c.k) return;
      if (c.obrigatorio){
        const vazio = c.tipo && c.tipo.startsWith('bi') ? !String(o[c.k + '_pt'] || '').trim() : !String(o[c.k] || '').trim();
        if (vazio) faltando.push(base + c.k + (c.tipo && c.tipo.startsWith('bi') ? '_pt' : ''));
      }
    });
  })(s.campos, obj, '');
  return faltando;
}

$('#editor-salvar').addEventListener('click', () => salvar());
async function salvar(){
  if (!estado.editando) return;
  const s = secao(estado.editando.secao);
  const obj = clonar(estado.rascunho);
  const faltando = validar(s, obj);
  if (faltando.length){
    faltando.forEach(c => { const el = $('#editor-corpo').querySelector(`[data-caminho="${CSS.escape(c)}"]`); if (el) el.classList.add('erro-campo'); });
    const primeiro = $('#editor-corpo').querySelector('.erro-campo');
    if (primeiro) primeiro.focus();
    avisar('Preencha os campos marcados com *.', 'erro');
    return;
  }
  const botao = $('#editor-salvar');
  botao.disabled = true; botao.textContent = 'Salvando…';
  try {
    if (s.doc){
      await setDoc(doc(bd, 'config', 'site'), obj);
      estado.dados.site = obj;
    } else {
      if (!obj.id){
        let id = slug(s.titulo(obj)) || (s.prefixo + '-' + Date.now().toString(36));
        if (estado.dados[s.id].some(x => x.id === id)) id += '-' + Date.now().toString(36).slice(-4);
        obj.id = id;
      }
      await setDoc(doc(bd, s.id, obj.id), obj);
      const i = estado.dados[s.id].findIndex(x => x.id === obj.id);
      if (i >= 0) estado.dados[s.id][i] = obj; else estado.dados[s.id].push(obj);
    }
    estado.sujo = false;
    fecharEditor(true);
    renderNav(); renderPrincipal();
    avisar('Salvo no banco. O site muda na próxima atualização (até 1 hora).', 'ok', 5000);
  } catch (e) {
    avisar(explicarErro(e), 'erro');
  } finally {
    botao.disabled = false; botao.textContent = 'Salvar';
  }
}

/* ── importar: mesma regra do build ({...atual, ...campos}, raso), sem merge do Firestore ── */
function normalizarImportacao(json){
  if (!json || typeof json !== 'object' || Array.isArray(json)) throw new Error('O arquivo não é um objeto JSON.');
  if (json._build || json._imgs || json._og)
    throw new Error('Este é o data/conteudo.json gerado pelo build: as imagens dele estão trocadas por "[base64]" e importar apagaria fotos. Use uma cópia baixada neste painel.');
  if (JSON.stringify(json).includes('"[base64]"'))
    throw new Error('O arquivo tem imagens trocadas por "[base64]". Use uma cópia baixada neste painel.');
  const limpar = o => Object.fromEntries(Object.entries(o || {}).filter(([k]) => !k.startsWith('_') && !k.startsWith('$')));
  const docs = [];
  for (const [chave, valor] of Object.entries(json)){
    if (chave.startsWith('$') || chave.startsWith('_')) continue;
    if (chave === 'site'){ if (valor && typeof valor === 'object') docs.push({ colecao:'config', id:'site', campos: limpar(valor) }); continue; }
    if (!TODAS.includes(chave)) throw new Error('Coleção desconhecida no arquivo: ' + chave);
    const lista = Array.isArray(valor) ? valor.map(d => [d && d.id, d]) : Object.entries(valor || {});
    for (const [id, d] of lista){
      if (!id) throw new Error('Há um documento sem id em ' + chave + '.');
      docs.push({ colecao: chave, id, campos: limpar(d) });
    }
  }
  return docs;
}
function planejarImportacao(docs){
  return docs.map(d => {
    const atual = d.colecao === 'config' ? estado.dados.site : estado.dados[d.colecao].find(x => x.id === d.id);
    const base = atual ? clonar(atual) : (d.colecao === 'config' ? {} : { id: d.id });
    const novo = Object.assign(base, d.campos);
    if (d.colecao !== 'config') novo.id = d.id;
    const antes = atual || {};
    const mudam = Object.keys(d.campos).filter(k => JSON.stringify(antes[k]) !== JSON.stringify(d.campos[k]));
    return { colecao: d.colecao, id: d.id, novo, mudam, existe: !!atual };
  }).filter(x => x.mudam.length || !x.existe);
}
function prepararImportacao(json, origem){
  try {
    const plano = planejarImportacao(normalizarImportacao(json));
    estado.importacao = { origem, plano };
  } catch (e) {
    estado.importacao = { origem, erro: e.message };
  }
  const alvo = $('#previa-importacao');
  if (alvo){ alvo.innerHTML = renderPreviaImportacao(); alvo.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
}
function renderPreviaImportacao(){
  const imp = estado.importacao;
  if (!imp) return '';
  if (imp.erro) return `<div class="previa-imp erro"><b>${esc(imp.origem)}</b><p>${esc(imp.erro)}</p></div>`;
  if (!imp.plano.length) return `<div class="previa-imp"><b>${esc(imp.origem)}</b><p>Nada a gravar: o banco já tem exatamente esse conteúdo.</p></div>`;
  const novos = imp.plano.filter(x => !x.existe).length;
  const linhas = imp.plano.map(x => `<tr><td class="mono">${esc(x.colecao === 'config' ? 'página inicial' : x.colecao + ' / ' + x.id)}</td><td>${x.existe ? 'atualiza' : '<b>novo</b>'}</td><td class="mono">${esc(x.mudam.slice(0, 8).join(', '))}${x.mudam.length > 8 ? ' e mais ' + (x.mudam.length - 8) : ''}</td></tr>`).join('');
  return `<div class="previa-imp"><b>${esc(imp.origem)}</b>
    <p>${imp.plano.length} documentos: ${novos} novos e ${imp.plano.length - novos} atualizados. Campos que o arquivo não traz ficam como estão.</p>
    <div class="previa-tabela"><table><thead><tr><th>documento</th><th></th><th>campos que mudam</th></tr></thead><tbody>${linhas}</tbody></table></div>
    <div class="linha-acoes"><button class="btn btn-forte" data-acao="gravar-importacao">Gravar no banco</button><button class="btn" data-acao="cancelar-importacao">Cancelar</button></div></div>`;
}
async function gravarImportacao(botao){
  const imp = estado.importacao;
  if (!imp || !imp.plano || !imp.plano.length) return;
  if (!confirm(`Gravar ${imp.plano.length} documentos no banco? Antes, o painel baixa uma cópia de segurança do banco atual.`)) return;
  exportar();
  botao.disabled = true; botao.textContent = 'Gravando…';
  try {
    const lotes = []; let lote = writeBatch(bd), ops = 0;
    for (const x of imp.plano){
      lote.set(doc(bd, x.colecao, x.id), x.novo);
      if (++ops === 450){ lotes.push(lote); lote = writeBatch(bd); ops = 0; }
    }
    lotes.push(lote);
    for (const l of lotes) await l.commit();
    avisar(imp.plano.length + ' documentos gravados. O site muda na próxima atualização.', 'ok', 6000);
    estado.importacao = null;
    await carregarTudo();
  } catch (e) {
    avisar(explicarErro(e), 'erro');
    botao.disabled = false; botao.textContent = 'Gravar no banco';
  }
}
$('#principal').addEventListener('change', async ev => {
  const inp = ev.target.closest('[data-importar-arquivo]');
  if (!inp || !inp.files || !inp.files[0]) return;
  const arquivo = inp.files[0];
  try { prepararImportacao(JSON.parse(await arquivo.text()), arquivo.name); }
  catch (e) { estado.importacao = { origem: arquivo.name, erro: 'Não é um JSON válido: ' + e.message }; $('#previa-importacao').innerHTML = renderPreviaImportacao(); }
  inp.value = '';
});

function exportar(){
  const copia = { $exportado: new Date().toISOString(), site: estado.dados.site };
  TODAS.forEach(c => copia[c] = ordenar(estado.dados[c]));
  const blob = new Blob([JSON.stringify(copia, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'davicjc-banco-' + new Date().toISOString().slice(0,16).replace(/[:T]/g, '-') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  avisar('Cópia do banco baixada.');
}
</script>
