  var limite = certExpandido ? lista.length : 6;
  var ROTULOS_LINK = { pdf:{pt:'pdf', en:'pdf'}, validar:{pt:'validar', en:'verify'} };
  var h = '';
  lista.slice(0, limite).forEach(function(x){

         '<span class="cert-nome">' + esc(c(x,'titulo')) + '</span><span class="cert-acoes">' +

           return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(r) + '</a>';
         }).join('') + '</span></div>';
  });
  if (lista.length > 6){

  caixa.innerHTML = h;

  if (b) b.addEventListener('click', function(){ certExpandido = !certExpandido; montarCertificados(); });

/* ── VISOR ────────────────────────────────────────────────────── */
var visor = document.getElementById('visor');
var visorQuadro = document.getElementById('visor-quadro');
var visorCarregando = document.getElementById('visor-carregando');
var visorDica = document.getElementById('visor-dica');
var temporizadorDica = null;
var focoAnterior = null;

function abrirVisor(id){
  var p = (DADOS.projetos||[]).filter(function(x){ return String(x.id) === String(id); })[0];
  if (!p) return;
  var url = urlEmbed(p);
  if (!url) return;

  focoAnterior = document.activeElement;
  document.getElementById('visor-nome').textContent = c(p,'titulo');
  document.getElementById('visor-url').textContent = url.replace(/^https?:\/\//,'');
  var abrir = document.getElementById('visor-abrir');
  abrir.href = url;

  /* o iframe só nasce agora — nunca no carregamento da página */
  var antigo = visorQuadro.querySelector('iframe');
  if (antigo) antigo.remove();
  visorCarregando.classList.remove('oculto');
  visorDica.classList.remove('visivel');

  var iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.loading = 'lazy';
  iframe.referrerPolicy = 'no-referrer-when-downgrade';
  iframe.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox');
  iframe.setAttribute('allow','camera; fullscreen; clipboard-write');   /* FitIA usa a webcam */
  iframe.setAttribute('title', c(p,'titulo'));
  iframe.addEventListener('load', function(){ visorCarregando.classList.add('oculto'); });
  visorQuadro.appendChild(iframe);

  /* Não dá para detectar bloqueio de embed entre origens diferentes.
     Então a saída "nova aba" fica sempre visível e a dica aparece
     depois de um tempo, caso nada tenha pintado. */
  clearTimeout(temporizadorDica);
  temporizadorDica = setTimeout(function(){ visorDica.classList.add('visivel'); }, 3500);

  visor.classList.add('aberto');
  document.body.style.overflow = 'hidden';
  document.getElementById('visor-fechar').focus();
}

function fecharVisor(){
  visor.classList.remove('aberto');
  document.body.style.overflow = '';
  clearTimeout(temporizadorDica);
  var f = visorQuadro.querySelector('iframe');
  if (f) f.remove();               /* descarrega o site embutido */
  if (focoAnterior && focoAnterior.focus) focoAnterior.focus();
}

document.getElementById('visor-fechar').addEventListener('click', fecharVisor);
visor.addEventListener('click', function(e){ if (e.target === visor) fecharVisor(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && visor.classList.contains('aberto')) fecharVisor();
});
document.getElementById('visor-desktop').addEventListener('click', function(){
  visorQuadro.classList.remove('telefone');
  this.setAttribute('aria-pressed','true');
  document.getElementById('visor-telefone').setAttribute('aria-pressed','false');
});
document.getElementById('visor-telefone').addEventListener('click', function(){
  visorQuadro.classList.add('telefone');
  this.setAttribute('aria-pressed','true');
  document.getElementById('visor-desktop').setAttribute('aria-pressed','false');
});

/* ── delegação de eventos ─────────────────────────────────────── */
document.addEventListener('click', function(e){
  var v = e.target.closest('[data-visor]');
  if (v){ e.preventDefault(); abrirVisor(v.getAttribute('data-visor')); return; }

  var f = e.target.closest('[data-filtro]');
  if (f){
    filtroProjeto = f.getAttribute('data-filtro');
    document.querySelectorAll('[data-filtro]').forEach(function(b){
      b.setAttribute('aria-pressed', b === f ? 'true' : 'false');
    });
    montarLinhas();
    return;
  }

  var ce = e.target.closest('[data-cert]');
  if (ce){
    certFiltro = ce.getAttribute('data-cert');
    certExpandido = false;
    document.querySelectorAll('[data-cert]').forEach(function(b){
      b.setAttribute('aria-pressed', b === ce ? 'true' : 'false');
    });
    montarCertificados();
    return;
  }
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.hasAttribute && e.target.hasAttribute('data-visor')){
    e.preventDefault(); abrirVisor(e.target.getAttribute('data-visor'));
  }
});

/* ── revelação ao rolar ───────────────────────────────────────── */
var observador = null;
function observar(){
  if (!('IntersectionObserver' in window)){
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('visivel'); });
    return;
  }
  if (!observador){
    observador = new IntersectionObserver(function(entradas){
      entradas.forEach(function(en, i){
        if (en.isIntersecting){
          var atraso = Math.min(i * 55, 220);
          setTimeout(function(){ en.target.classList.add('visivel'); }, atraso);
          observador.unobserve(en.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.04 });
  }
  document.querySelectorAll('.reveal:not(.visivel)').forEach(function(el){ observador.observe(el); });
}

/* ── rotas ────────────────────────────────────────────────────── */
function rotaAtual(){
  var h = location.hash || '#/';
  if (h.indexOf('#/projetos') === 0) return '/projetos';
  if (h.indexOf('#/') === 0) return '/';
  return null; /* âncora dentro da home */
}
function buscarAncora(hash){
  try { return hash && hash.length > 1 ? document.querySelector(hash) : null; } catch (e) { return null; }
}
/* opcoes.manterRolagem: troca de idioma e hidratação não mexem na posição.
   opcoes.semAnimacao: conteúdo já visto não refaz o fade de entrada. */
function rotear(opcoes){
  opcoes = opcoes || {};
  var y = window.scrollY;
  var rota = rotaAtual();
  if (rota === '/projetos'){ renderProjetos(); }
  else if (rota === '/'){ renderHome(); }
  else {
    /* âncora: garante que a home está montada, depois rola */
    renderHome();
    var alvoAncora = buscarAncora(location.hash);
    if (alvoAncora && !opcoes.manterRolagem){
      setTimeout(function(){ alvoAncora.scrollIntoView({ behavior:'smooth', block:'start' }); }, 30);
    }
  }
  document.querySelectorAll('.menu a[data-rota]').forEach(function(a){
    a.classList.toggle('ativo', a.getAttribute('data-rota') === rota);
  });
  document.title = rota === '/projetos'
    ? (idioma === 'en' ? 'Projects — Davi Castro' : 'Projetos — Davi Castro')
    : 'Davi Castro — ' + (idioma === 'en' ? 'Full Stack Developer & Network Infrastructure' : 'Desenvolvedor Full Stack & Infraestrutura de Redes');
  var rt = document.getElementById('rodape-texto');
  if (rt){
    rt.textContent = '© ' + new Date().getFullYear() + ' Davi Castro Jorge da Costa · ' +
      (idioma === 'en' ? 'built and maintained by me' : 'feito e mantido por mim');
  }
  if (opcoes.semAnimacao){
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('visivel'); });
  }
  if (opcoes.manterRolagem) window.scrollTo(0, y);
  else if (rota) window.scrollTo(0, 0);
  observar();
  /* efeitos visuais (3D, animações de rolagem) se reconectam ao novo conteúdo aqui */
  document.dispatchEvent(new CustomEvent('davicjc:render', { detail: { rota: rota || '/', idioma: idioma } }));
}
window.addEventListener('hashchange', function(){ rotear(); });

/* âncoras internas quando a home já está na tela: rola sem re-renderizar */
document.addEventListener('click', function(e){
  var a = e.target.closest('a[href^="#"]');
  if (!a) return;
  var href = a.getAttribute('href');
  if (href.indexOf('#/') === 0 || href === '#') return;
  var destino = buscarAncora(href);
  if (destino && document.getElementById('trajetoria')){
    e.preventDefault();
    history.pushState(null, '', href);
    destino.scrollIntoView({ behavior:'smooth', block:'start' });
    document.querySelectorAll('.menu a[data-rota]').forEach(function(x){ x.classList.remove('ativo'); });
  }
});

/* sombra do topo */
addEventListener('scroll', function(){
  document.getElementById('topo').classList.toggle('rolou', scrollY > 8);
}, { passive:true });

/* ── partida ──────────────────────────────────────────────────── */
document.getElementById('lang-pt').setAttribute('aria-pressed', String(idioma === 'pt'));
document.getElementById('lang-en').setAttribute('aria-pressed', String(idioma === 'en'));
document.documentElement.lang = idioma === 'en' ? 'en' : 'pt-BR';
rotear();

/* ── hidratação pelo Firestore ────────────────────────────────── */
window.__hidratar = function(remoto){
  if (!remoto) return;
  var novo = JSON.parse(JSON.stringify(DADOS));
  var semeado = !!remoto.site;
  ['site'].concat(COLECOES).forEach(function(k){
    if (!remoto[k]) return;
    if (Array.isArray(remoto[k]) && !remoto[k].length && !semeado) return;   /* banco sem carga: mantém a semente */
    novo[k] = remoto[k];
  });
  novo = normalizar(novo);
  try { localStorage.setItem(CHAVE_CACHE, JSON.stringify(novo)); } catch (e) {}
  if (canonico(novo) === canonico(DADOS)) return;   /* nada mudou: não redesenha */
  DADOS = novo;
  if (visor.classList.contains('aberto')) return;    /* não mexe na tela com o visor aberto */
  rotear({ manterRolagem: true, semAnimacao: true });
};
})();
</script>

<script type="module">
/* Firestore é a fonte de verdade. Se algo aqui falhar, a página
   permanece de pé com os dados embutidos acima. */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getFirestore, collection, getDocs, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const config = {
  apiKey: "AIzaSyD9juzHnTpUhzUYy84Wa31b6sNT2uSxDVc",
  authDomain: "portfoliopessoal-9aa5b.firebaseapp.com",
  projectId: "portfoliopessoal-9aa5b",
  storageBucket: "portfoliopessoal-9aa5b.firebasestorage.app",
  messagingSenderId: "1011139931499",
  appId: "1:1011139931499:web:961f85dda2a4d9d2a7302e"
};

const bd = getFirestore(initializeApp(config));
try {
  const colecoes = ['capacidades','experiencias','projetos','depoimentos','certificados','clientes','contatos'];
  /* leitura única com limite de tempo: a página não fica presa a um banco lento */
  const [siteSnap, ...snaps] = await Promise.race([
    Promise.all([
      getDoc(doc(bd, 'config', 'site')),
      ...colecoes.map(nome => getDocs(collection(bd, nome)))
    ]),
    new Promise((_, rejeita) => setTimeout(() => rejeita({ code: 'tempo-esgotado' }), 10000))
  ]);
  /* Com config/site no banco, ele já foi populado: coleção vazia é vazia de verdade.
     Sem ela, o banco ainda não recebeu a carga e a semente embutida continua valendo. */
  const semeado = siteSnap.exists();
  const remoto = {};
  if (semeado) remoto.site = siteSnap.data();
  snaps.forEach((snap, i) => {
    if (semeado || !snap.empty) remoto[colecoes[i]] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  });
  window.__hidratar(remoto);
} catch (erro) {
  console.info('[davicjc] Firestore indisponível; exibindo dados embutidos.', erro && erro.code);
}
</script>
